      def fetch_nordlynx_key(token):
          """Získa WireGuard (NordLynx) privátny kľúč z NordVPN access tokenu. Token sa neukladá."""
          r = requests.get("https://api.nordvpn.com/v1/users/services/credentials", auth=("token", token.strip()), timeout=20)
          if r.status_code in (401, 403): raise ValueError("NordVPN odmietol token (neplatný alebo expirovaný).")
          r.raise_for_status()
          k = (r.json() or {}).get("nordlynx_private_key", "")
          if not WG_KEY_RE.match(k or ""): raise ValueError("NordVPN nevrátil NordLynx kľúč.")
          return k


