      # --- webhooky n8n cez aplikáciu (jeden verejný port: rozhranie + noVNC + webhooky). Chránené kľúčmi vo workflow.
      @app.api_route("/webhook/{path:path}", methods=["GET", "POST"])
      @app.api_route("/webhook-test/{path:path}", methods=["GET", "POST"])
      async def n8n_webhook_proxy(path: str, request: Request):
          from starlette.concurrency import run_in_threadpool
          base = "webhook-test" if request.url.path.startswith("/webhook-test/") else "webhook"
          body = await request.body()
          headers = {k: v for k, v in request.headers.items() if k.lower() in ("content-type", "x-api-key", "accept")}
          try:
              r = await run_in_threadpool(lambda: requests.request(request.method, f"{N8N_URL}/{base}/{path}", params=dict(request.query_params),
                                                                   data=body, headers=headers, timeout=900))
          except requests.RequestException as e:
              return PlainTextResponse(f"n8n nie je dostupné: {e}", status_code=502)
          return Response(r.content, status_code=r.status_code, media_type=r.headers.get("content-type"))


      # --- noVNC (okno na prihlásenie účtu) cez aplikáciu: staticky + WebSocket na kontajner ig-login
