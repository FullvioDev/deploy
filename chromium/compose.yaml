  f_manager_templates_ai_html:
    content: |
      {% extends "base.html" %}{% set nav='ai' %}{% block body %}
      <div class="card"><h2>AI model šéf-agenta</h2>
      <p><small>Model premení tvoj príkaz na úlohy. Bezpečnostné pravidlá (limity, blacklist, aktívne účty, formát odkazov, schvaľovanie komentárov) sa kontrolujú v kóde, nie v modeli, takže slabší model nemôže obísť ochrany. Modelu sa posiela: príkaz, mená aktívnych účtov so zostávajúcimi limitmi, blacklist a posledné texty komentárov. Pri lokálnom modeli neodchádza nič mimo tvoj server.</small></p>
      <p>Rýchle predvoľby:
      <button type="button" class="btn" onclick="preset('anthropic','','claude-sonnet-5-5')">Claude (Anthropic)</button>
      <button type="button" class="btn" onclick="preset('openai_compat','https://api.openai.com/v1','')">OpenAI</button>
      <button type="button" class="btn" onclick="preset('openai_compat','https://openrouter.ai/api/v1','')">OpenRouter</button>
      <button type="button" class="btn" onclick="preset('openai_compat','http://ollama:11434/v1','')">Lokálny – Ollama (v tomto compose)</button>
      <button type="button" class="btn" onclick="preset('openai_compat','http://host.docker.internal:11434/v1','')">Lokálny – Ollama na hostiteľovi</button>
      <button type="button" class="btn" onclick="preset('openai_compat','http://host.docker.internal:1234/v1','')">Lokálny – LM Studio</button></p>
      <form method="post" action="/settings/ai/save">
      <div class="grid">
      <div><label>Provider</label><select name="provider" id="provider"><option value="anthropic" {{ 'selected' if cfg.ai_provider=='anthropic' }}>Anthropic (Claude API)</option><option value="openai_compat" {{ 'selected' if cfg.ai_provider=='openai_compat' }}>OpenAI-kompatibilné API (OpenAI, OpenRouter, Ollama, LM Studio, vLLM, llama.cpp …)</option></select></div>
      <div><label>Base URL (pri Claude nechaj prázdne)</label><input name="base_url" id="base_url" value="{{ cfg.ai_base_url }}" placeholder="http://ollama:11434/v1"></div>
      <div><label>Model</label><input name="model" id="model" list="mlist" value="{{ cfg.ai_model }}" required>
      <datalist id="mlist">{% for m in models %}<option value="{{ m }}">{% endfor %}<option value="claude-sonnet-5-5"><option value="claude-opus-5-5"><option value="claude-haiku-5-5"></datalist>
      <small>{% if models %}Načítané zo servera: {{ models|length }} modelov (začni písať).{% else %}Lokálne napr. qwen2.5:7b-instruct alebo llama3.1:8b (musí byť stiahnutý).{% endif %}</small></div>
      <div><label>API kľúč {% if has_key %}(uložený – prázdne = ponechať){% else %}(pri lokálnom modeli netreba){% endif %}</label><input name="api_key" type="password" autocomplete="new-password">
      {% if has_key %}<label style="display:inline"><input type="checkbox" name="clear_key" value="1" style="width:auto"> zmazať uložený kľúč</label>{% endif %}</div>
      <div><label>Teplota (prázdne = predvolená)</label><input name="temperature" value="{{ cfg.ai_temperature }}" placeholder="0.4"></div>
      <div><label>Max. tokenov odpovede</label><input type="number" name="max_tokens" value="{{ cfg.ai_max_tokens }}"></div>
      <div><label>Timeout (s) – lokálne modely bývajú pomalé</label><input type="number" name="timeout_s" value="{{ cfg.ai_timeout_s }}"></div></div>
      <p><label style="display:inline"><input type="checkbox" name="json_mode" value="1" style="width:auto" {{ 'checked' if cfg.ai_json_mode=='1' }}> vynútiť JSON režim (OpenAI-kompatibilné servery; vypni, ak server hlási chybu)</label></p>
      <details {{ 'open' if custom_prompt }}><summary><b>Prompt šéf-agenta</b> {% if custom_prompt %}<span class="tag warn">upravený</span>{% else %}<small>(predvolený)</small>{% endif %}</summary>
      <p><small>Úprava je určená na doladenie slabších modelov. Pravidlá v kóde platia nezávisle od textu promptu. Výstup musí zostať JSON podľa predlohy.</small></p>
      <textarea name="prompt" rows="16" style="font-family:monospace;font-size:13px">{{ prompt }}</textarea></details>
      <p style="margin-top:12px"><button class="p">Uložiť</button>
      <button formaction="/settings/ai/test" formnovalidate>Otestovať spojenie (bez uloženia)</button></p></form></div>
      <script>
      function preset(p,u,m){document.getElementById('provider').value=p;document.getElementById('base_url').value=u;if(m)document.getElementById('model').value=m;}
      </script>
      {% endblock %}
  f_manager_templates_base_html:
    content: |
      <!doctype html>
      <html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
      <title>IG Brand Agents</title>
      {% if refresh %}<meta http-equiv="refresh" content="{{ refresh }}">{% endif %}
      <style>
      :root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ac:#2f5bea;--ok:#0f8a4f;--warn:#b7791f;--bad:#c53030}
      @media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#9aa1ab;--bd:#2c3038;--ac:#6f93ff;--ok:#41c27f;--warn:#e0a94a;--bad:#f06a6a}}
      *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
      header{background:var(--card);border-bottom:1px solid var(--bd);padding:0 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
      header b{padding:14px 0}header a{color:var(--mut);text-decoration:none;padding:14px 0}header a.on,header a:hover{color:var(--tx)}
      main{max-width:1180px;margin:0 auto;padding:16px}
      .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:16px}
      h2{margin:0 0 10px;font-size:16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
      th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
      .tablewrap{overflow-x:auto}
      button,.btn{font:inherit;padding:5px 10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
      button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--bad)}
      input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);width:100%}
      form.inline{display:inline}label{display:block;color:var(--mut);font-size:12px;margin:8px 0 3px}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
      .tag{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
      .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
      .flash{padding:10px 14px;border-radius:8px;margin-bottom:14px}.flash.m{background:rgba(15,138,79,.12);color:var(--ok)}.flash.e{background:rgba(197,48,48,.12);color:var(--bad)}
      .stats{display:flex;gap:26px;flex-wrap:wrap}.stats div b{display:block;font-size:24px}
      small{color:var(--mut)}details summary{cursor:pointer}
      </style></head><body>
      <header><b>IG Brand Agents</b>
      <a href="/" class="{{ 'on' if nav=='dash' }}">Prehľad</a><a href="/tasks" class="{{ 'on' if nav=='tasks' }}">Úlohy</a>
      <a href="/logs" class="{{ 'on' if nav=='logs' }}">Logy</a><a href="/settings" class="{{ 'on' if nav=='set' }}">Nastavenia</a><a href="/settings/ai" class="{{ 'on' if nav=='ai' }}">AI model</a><a href="/settings/vpn" class="{{ 'on' if nav=='vpn' }}">VPN</a></header>
      <main>
      {% if msg %}<div class="flash m">{{ msg }}</div>{% endif %}{% if err %}<div class="flash e">{{ err }}</div>{% endif %}
      {% if worker_build.status == 'building' %}<div class="flash e" style="background:rgba(183,121,31,.15);color:var(--warn)">⏳ {{ worker_build.log }} Kým nie je hotové, nejde spustiť workery ani prihlásenie účtov. Stránka sa obnovuje.</div><meta http-equiv="refresh" content="20">
      {% elif worker_build.status == 'failed' %}<div class="flash e">Obraz workera nie je k dispozícii: {{ worker_build.log }}
      <form method="post" action="/system/build-worker" style="margin-top:8px"><button>Zostaviť znova</button></form></div>{% endif %}
      {% if not docker_ok %}<div class="flash e">Docker nie je dostupný – správa workerov je vypnutá.</div>{% endif %}
      {% block body %}{% endblock %}
      </main></body></html>
  f_manager_templates_dashboard_html:
    content: |
      {% extends "base.html" %}{% set nav='dash' %}{% set refresh=20 %}
      {% block body %}
      <div class="card"><div class="stats">
      <div><b>{{ stats.done }}</b><small>hotové dnes</small></div><div><b>{{ stats.failed }}</b><small>zlyhané dnes</small></div>
      <div><b>{{ stats.queued }}</b><small>vo fronte</small></div><div><b>{{ pending|length }}</b><small>čaká na schválenie</small></div>
      <div><b>{{ n_workers }}</b><small>bežiace workery</small></div>
      {% if mem_total %}<div><b>{{ mem_avail }} / {{ mem_total }} GB</b><small>RAM voľná / celková (cca 1 GB na účet)</small></div>{% endif %}
      </div></div>

      {% if pending %}<div class="card"><h2>Komentáre na schválenie</h2><div class="tablewrap"><table>
      <tr><th>#</th><th>Účet</th><th>Príspevok</th><th>Text komentára</th><th></th></tr>
      {% for p in pending %}<tr><td>{{ p.id }}</td><td>{{ p.ig_username }}</td><td><a href="{{ p.post_url }}" target="_blank" rel="noopener">odkaz</a><br><small>{{ p.post_context or '' }}</small></td>
      <td>{{ p.comment_text }}</td><td style="white-space:nowrap">
      <form class="inline" method="post" action="/tasks/{{ p.id }}/approve"><input type="hidden" name="next" value="/"><button class="p">Schváliť</button></form>
      <form class="inline" method="post" action="/tasks/{{ p.id }}/reject"><input type="hidden" name="next" value="/"><button class="d">Zamietnuť</button></form></td></tr>{% endfor %}
      </table></div></div>{% endif %}

      <div class="card"><h2>Príkaz pre šéf-agenta</h2>
      <form method="post" action="/agent"><textarea name="command" rows="2" required placeholder="napr. Daj like na https://www.instagram.com/p/XXXX/ z účtu {{ accounts[0].ig_username if accounts else 'meno_uctu' }}. Popis príspevku: …"></textarea>
      <p><button class="p">Odoslať agentovi</button> <small>Model: <a href="/settings/ai">{{ ai_model }}</a>. Komentáre čakajú na tvoje schválenie. Lokálne modely môžu odpovedať aj minútu.</small></p></form></div>

      <div class="card"><h2>Účty</h2><div class="tablewrap"><table>
      <tr><th>Účet</th><th>Stav</th><th>Worker</th><th>VPN / IP</th><th>Dnes (👍 / 💬)</th><th>Režim</th><th>Naposledy</th><th>Akcie</th></tr>
      {% for a in accounts %}{% set st = states.get(a.ig_username) %}<tr>
      <td><b><a href="/accounts/{{ a.id }}">{{ a.ig_username }}</a></b>{% if a.risk_reason %}<br><small class="bad">{{ a.risk_reason }}</small>{% endif %}</td>
      <td><span class="tag {{ 'ok' if a.status=='active' else ('bad' if a.status=='risk' else 'warn') }}">{{ a.status }}</span>{% if not a.brand_disclosed %}<br><small class="warn">nepotvrdený ako značkový</small>{% endif %}</td>
      <td>{% if not a.managed_locally %}<small>externý</small>{% elif st %}<span class="{{ 'ok' if st.startswith('running') else 'bad' }}">{{ st }}</span>{% else %}<span class="mut">nebeží</span>{% endif %}</td>
      <td>{% if a.vpn_mode == 'nordvpn' %}NordVPN · {{ a.vpn_country }}{% if a.vpn_city %}/{{ a.vpn_city }}{% endif %}<br><small>{{ a.exit_ip or '–' }} · {{ vstates.get(a.ig_username, 'nebeží') }}</small>{% else %}<span class="warn">bez VPN</span><br><small>IP servera</small>{% endif %}</td>
      <td>{{ a.likes_today }}/{{ a.daily_like_limit }} · {{ a.comments_today }}/{{ a.daily_comment_limit }}</td>
      <td>{% if a.dry_run %}<span class="tag warn">dry-run</span>{% else %}<span class="tag ok">naostro</span>{% endif %}</td>
      <td>{{ a.seen_s or '–' }}{% if a.seen_age > 300 and a.status=='active' %} <span class="bad">⚠</span>{% endif %}</td>
      <td style="white-space:nowrap">
      {% if a.managed_locally %}<form class="inline" method="post" action="/accounts/{{ a.id }}/login"><button>Prihlásiť</button></form>
      {% if st and st.startswith('running') %}<form class="inline" method="post" action="/accounts/{{ a.id }}/worker/stop"><button>Stop</button></form>
      {% else %}<form class="inline" method="post" action="/accounts/{{ a.id }}/worker/start"><button>Štart</button></form>{% endif %}{% endif %}
      {% if a.status!='active' and a.status!='risk' %}<form class="inline" method="post" action="/accounts/{{ a.id }}/status/activate"><label style="display:inline"><input type="checkbox" name="confirm" style="width:auto" required title="Účet je zjavne značkový a patrí nám"> značkový</label> <button class="p">Aktivovať</button></form>{% endif %}
      {% if a.status=='active' %}<form class="inline" method="post" action="/accounts/{{ a.id }}/status/pause"><button>Pauza</button></form>{% endif %}
      {% if a.status=='risk' %}<form class="inline" method="post" action="/accounts/{{ a.id }}/status/unblock"><button class="p">Odblokovať</button></form>{% endif %}
      {% if a.dry_run %}<form class="inline" method="post" action="/accounts/{{ a.id }}/status/golive"><label style="display:inline"><input type="checkbox" name="confirm" style="width:auto" required> reálne</label> <button>Naostro</button></form>
      {% else %}<form class="inline" method="post" action="/accounts/{{ a.id }}/status/dryrun"><button>Späť na dry-run</button></form>{% endif %}
      </td></tr>{% else %}<tr><td colspan="8" class="mut">Zatiaľ žiadny účet. Pridaj prvý nižšie.</td></tr>{% endfor %}
      </table></div></div>

      <div class="card"><details {{ 'open' if not accounts }}><summary><b>+ Pridať účet</b></summary>
      <form method="post" action="/accounts/add"><div class="grid">
      <div><label>Používateľské meno na Instagrame</label><input name="username" required pattern="[A-Za-z0-9._]{1,30}"></div>
      <div><label>Pripojenie</label><select name="vpn_mode"><option value="nordvpn">NordVPN (odporúčané)</option><option value="none">bez VPN (IP servera)</option></select></div>
      <div><label>NordVPN krajina (napr. Slovakia)</label><input name="vpn_country" value="{{ default_country }}" placeholder="Slovakia"></div>
      <div><label>Mesto (voliteľné)</label><input name="vpn_city" value="{{ default_city }}"></div></div>
      <p><label style="display:inline"><input type="checkbox" name="start" value="1" style="width:auto" checked> hneď spustiť worker (kontajner) na tomto serveri</label><br>
      <label style="display:inline"><input type="checkbox" name="external" value="1" style="width:auto"> worker pobeží na samostatnom VPS (docker-compose.worker.yml) – rozhranie ho len sleduje</label></p>
      <button class="p">Pridať účet</button> <small>Po pridaní klikni Prihlásiť, potom Aktivovať. Nový účet beží v dry-run, nič neodosiela.</small></form></details></div>
      {% endblock %}
  f_manager_templates_login_html:
    content: |
      {% extends "base.html" %}{% block body %}
      <div class="card"><h2>Prihlásenie účtu {{ a.ig_username }}</h2>
      {% if state == 'running' %}
      <p>Otvorí sa prehliadač tohto účtu (cez NordVPN účtu, ak je zapnutý). Prihlás sa na Instagram vrátane 2FA a odklikni cookie okno či ponuku „Uložiť prihlásenie“. Vloženie textu: panel schránky v noVNC (ľavý okraj). Potom sa vráť sem a klikni „Hotovo“. Nezatváraj to skôr a po kliknutí počkaj niekoľko sekúnd, kým sa profil uloží.</p>
      <p><a class="btn p" style="color:#fff" href="/novnc/vnc.html?autoconnect=1&resize=scale&path=novnc/websockify" target="_blank" rel="noopener">Otvoriť prehliadač účtu</a></p>
      {% elif state == 'none' or state is none %}<p class="warn">Prihlasovacia relácia nebeží. Spusti ju z prehľadu tlačidlom „Prihlásiť“.</p>
      {% else %}<p>Relácia sa ukončila (stav: {{ state }}). Klikni „Hotovo“.</p>{% endif %}
      <form method="post" action="/accounts/{{ a.id }}/login/done"><button class="p">Hotovo – spustiť worker</button> <a class="btn" href="/">Zrušiť</a></form></div>
      {% endblock %}
  f_manager_templates_logs_html:
    content: |
      {% extends "base.html" %}{% set nav='logs' %}{% set refresh=30 %}{% block body %}
      <div class="card"><h2>Posledné udalosti</h2><div class="tablewrap"><table><tr><th>Čas</th><th>Účet</th><th>Úloha</th><th>Udalosť</th><th>Chyba</th><th>Screenshot</th></tr>
      {% for r in rows %}<tr><td>{{ r.t }}</td><td>{{ r.ig_username or '' }}</td><td>{{ r.task_id or '' }}</td>
      <td class="{{ 'bad' if r.event in ('risk','failed','ambiguous') else ('ok' if r.event=='done' else '') }}">{{ r.event }}</td><td><small>{{ r.error }}</small></td>
      <td>{% if r.shot and r.ig_username %}<a href="/shots/{{ r.ig_username }}/{{ r.shot }}" target="_blank">zobraziť</a>{% endif %}</td></tr>
      {% else %}<tr><td colspan="6" class="mut">Zatiaľ nič.</td></tr>{% endfor %}</table></div></div>{% endblock %}
  f_manager_templates_settings_html:
    content: |
      {% extends "base.html" %}{% set nav='set' %}{% block body %}
      <div class="card"><h2>Cieľové príspevky</h2>
      <p>Zoznam povolených autorov už neexistuje. Cieľové príspevky určuješ <b>príkazom pre šéf-agenta</b> (Prehľad) alebo ručnou úlohou: účet vykoná akciu len na konkrétnych odkazoch, ktoré zadáš. Komentáre vždy čakajú na tvoje schválenie.</p></div>
      <div class="card"><h2>Blacklist</h2><table>{% for r in black %}<tr><td>{{ r.kind }}</td><td>{{ r.value }}</td><td><form method="post" action="/settings/black/{{ r.id }}/delete"><button class="d">Odstrániť</button></form></td></tr>
      {% else %}<tr><td class="mut">Prázdny.</td></tr>{% endfor %}</table>
      <form method="post" action="/settings/black/add" class="grid" style="margin-top:10px"><div><label>Typ</label><select name="kind"><option value="word">slovo v komentári</option><option value="post_url">URL príspevku</option></select></div>
      <div><label>Hodnota</label><input name="value" required></div><div style="align-self:end"><button class="p">Pridať</button></div></form></div>
      {% endblock %}
  f_manager_templates_tasks_html:
    content: |
      {% extends "base.html" %}{% set nav='tasks' %}{% set refresh=30 %}{% block body %}
      <div class="card"><details><summary><b>+ Nová úloha ručne</b></summary>
      <form method="post" action="/tasks/new"><div class="grid">
      <div><label>Účet</label><select name="account_id">{% for a in accounts %}<option value="{{ a.id }}">{{ a.ig_username }}</option>{% endfor %}</select></div>
      <div><label>Akcia</label><select name="action"><option value="like">like</option><option value="comment">comment</option></select></div>
      <div style="grid-column:1/-1"><label>URL príspevku</label><input name="post_url" required placeholder="https://www.instagram.com/p/…"></div>
      <div style="grid-column:1/-1"><label>Text komentára (len pri comment; musí byť unikátny)</label><textarea name="comment_text" rows="2"></textarea></div>
      <div style="grid-column:1/-1"><label>Poznámka k príspevku (voliteľné)</label><input name="post_context"></div></div>
      <p><button class="p">Vytvoriť</button> <small>Komentár pôjde najprv na schválenie.</small></p></form></details></div>
      <div class="card"><h2>Úlohy</h2>
      <p>{% for s in ['', 'pending','awaiting_approval','in_progress','done','failed','cancelled'] %}<a class="btn" href="/tasks?status={{ s }}" style="{{ 'font-weight:700' if s==status }}">{{ s or 'všetky' }}</a> {% endfor %}</p>
      <div class="tablewrap"><table><tr><th>#</th><th>Účet</th><th>Akcia</th><th>Príspevok / text</th><th>Stav</th><th>Výsledok</th><th>Vytvorené</th><th></th></tr>
      {% for r in rows %}<tr><td>{{ r.id }}</td><td>{{ r.ig_username }}</td><td>{{ r.action }}</td>
      <td><a href="{{ r.post_url }}" target="_blank" rel="noopener">odkaz</a>{% if r.comment_text %}<br><small>{{ r.comment_text }}</small>{% endif %}</td>
      <td>{{ r.status }}{% if r.attempts %} <small>({{ r.attempts }}×)</small>{% endif %}</td><td><small>{{ r.result }}</small></td><td><small>{{ r.created }}</small></td>
      <td style="white-space:nowrap">{% if r.status=='awaiting_approval' %}<form class="inline" method="post" action="/tasks/{{ r.id }}/approve"><input type="hidden" name="next" value="/tasks"><button class="p">Schváliť</button></form>{% endif %}
      {% if r.status in ('awaiting_approval','pending') %}<form class="inline" method="post" action="/tasks/{{ r.id }}/cancel"><input type="hidden" name="next" value="/tasks"><button class="d">Zrušiť</button></form>{% endif %}</td></tr>
      {% else %}<tr><td colspan="8" class="mut">Žiadne úlohy.</td></tr>{% endfor %}</table></div></div>{% endblock %}
  f_manager_templates_vpn_html:
    content: |
      {% extends "base.html" %}{% set nav='vpn' %}{% block body %}
      <div class="card"><h2>NordVPN</h2>
      <p><small>Každý účet má vlastný VPN kontajner (gluetun, WireGuard/NordLynx) a worker ide výhradne cez neho. Ak VPN spadne, worker nemá spojenie, nikdy nejde z IP servera. Pre všetky účty sa používa jeden NordLynx kľúč tvojho NordVPN účtu.</small></p>
      <p>Stav kľúča: {% if has_key %}<span class="tag ok">uložený</span>{% else %}<span class="tag bad">chýba</span>{% endif %}</p>
      <form method="post" action="/settings/vpn/save"><div class="grid">
      <div><label>Možnosť A: NordVPN access token (z neho sa získa kľúč; token sa neukladá)</label><input name="access_token" type="password" autocomplete="off"></div>
      <div><label>Možnosť B: priamo NordLynx / WireGuard privátny kľúč</label><input name="private_key" type="password" autocomplete="off"></div></div>
      <p><button class="p">Uložiť kľúč</button>
      {% if has_key %}<button name="clear_key" value="1" class="d" formnovalidate>Zmazať kľúč</button>{% endif %}</p></form></div>
      <div class="card"><h2>Otestovať pripojenie</h2>
      <form method="post" action="/settings/vpn/test" class="grid"><div><label>Krajina</label><input name="country" value="{{ countries.split(',')[0] if countries else 'Slovakia' }}" required></div>
      <div><label>Mesto (voliteľné)</label><input name="city" value="{{ cities.split(',')[0] if cities else '' }}"></div>
      <div style="align-self:end"><button>Spustiť test (do 2,5 min)</button></div></form>
      <p><small>Spustí dočasný VPN kontajner, zistí výstupnú IP a odstráni ho.</small></p></div>
      <div class="card"><h2>VPN účtov</h2><table><tr><th>Účet</th><th>Krajina / mesto</th><th>Server</th><th>Výstupná IP</th><th>Kontajner</th></tr>
      {% for a in accounts %}<tr><td>{{ a.ig_username }}</td><td>{{ a.vpn_country }}{% if a.vpn_city %} / {{ a.vpn_city }}{% endif %}</td><td>{{ a.vpn_hostname or 'podľa výberu' }}</td><td>{{ a.exit_ip or '–' }}</td><td>{{ vstates.get(a.ig_username, 'nebeží') }}</td></tr>
      {% else %}<tr><td colspan="5" class="mut">Žiadny účet nepoužíva NordVPN.</td></tr>{% endfor %}</table>
      <p><small>Obmedzenia: NordVPN povoľuje obmedzený počet súčasných pripojení na účet (každý beziaci účet = jedno pripojenie; over aktuálny limit u NordVPN). Výstupné IP NordVPN sú zdieľané s ďalšími zákazníkmi a pochádzajú z dátových centier; Instagram ich môže posudzovať prísnejšie. Server musí mať zariadenie /dev/net/tun (bežné KVM VPS áno; niektoré kontajnerové VPS nie).</small></p></div>
      {% endblock %}
  f_worker_Dockerfile:
    content: |
      FROM mcr.microsoft.com/playwright/python:v1.48.0-jammy
      # bez tohto sa tzdata pýta na časové pásmo a build navždy visí
      ARG DEBIAN_FRONTEND=noninteractive
      RUN apt-get update && apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify openbox \
          fonts-liberation fonts-liberation2 fonts-noto-core fonts-noto-ui-core \
          fonts-noto-color-emoji fonts-dejavu-core fonts-dejavu-extra \
          fonts-freefont-ttf fonts-ubuntu \
          && fc-cache -f -v \
          && rm -rf /var/lib/apt/lists/*
      WORKDIR /app
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY worker.py login.sh ./
      RUN chmod +x login.sh
      HEALTHCHECK --interval=60s --timeout=5s --start-period=60s --retries=3 \
        CMD python -c "import time,sys;sys.exit(0 if time.time()-float(open('/tmp/heartbeat').read())<180 else 1)"
      CMD ["python", "worker.py"]
  f_worker_worker_py:
    content: |
      """Worker pre jeden značkový IG účet. Playwright, persistentný profil, stabilná IP (proxy per účet)."""
      import os, random, sys, time, datetime
      from urllib.parse import urlparse

      import psycopg2, psycopg2.extras, requests
      from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
      from playwright_stealth import stealth_sync

      ACCOUNT = os.environ["ACCOUNT_USERNAME"]
      DSN = os.environ["DATABASE_URL"]
      PROFILE_DIR = os.environ.get("PROFILE_DIR", "/data/profile")
      SHOT_DIR = os.environ.get("SCREENSHOT_DIR", "/data/screenshots")
      ALERT_WEBHOOK = os.environ.get("N8N_ALERT_WEBHOOK", "")
      HEADLESS = os.environ.get("HEADLESS", "true").lower() == "true"
      HEARTBEAT_FILE = "/tmp/heartbeat"
      IDLE_SLEEP = int(os.environ.get("IDLE_SLEEP", 30))
      LEASE_MIN = int(os.environ.get("LEASE_MINUTES", 10))

      # Selektory závisia od jazyka UI – uprav podľa locale účtu.
      SEL = {
          "like":      os.environ.get("SEL_LIKE", 'svg[aria-label="Like"]'),
          "unlike":    os.environ.get("SEL_UNLIKE", 'svg[aria-label="Unlike"]'),
          "comment":   os.environ.get("SEL_COMMENT", 'textarea[aria-label="Add a comment…"]'),
      }
      POST_LABEL = os.environ.get("POST_LABEL", "Post")
      RISK_URL_PARTS = ("/challenge", "/accounts/login", "/suspended", "/accounts/suspended")
      RISK_TEXTS = ("unusual activity", "suspicious", "try again later", "confirm it's you",
                    "action blocked", "we restrict certain activity")

      os.makedirs(SHOT_DIR, exist_ok=True)
      os.makedirs(PROFILE_DIR, exist_ok=True)
      for _f in ("SingletonLock", "SingletonCookie", "SingletonSocket"):   # zostatky po reštarte kontajnera
          try:
              os.remove(os.path.join(PROFILE_DIR, _f))
          except FileNotFoundError:
              pass
      db = psycopg2.connect(DSN)
      db.autocommit = True


      def q(sql, args=None, one=False):
          with db.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
              cur.execute(sql, args)
              if cur.description:
                  return cur.fetchone() if one else cur.fetchall()


      def log(task_id, account_id, event, error=None, shot=None):
          q("INSERT INTO logs(task_id,account_id,event,error,screenshot_url) VALUES(%s,%s,%s,%s,%s)",
            (task_id, account_id, event, error, shot))


      def alert(kind, msg):
          print(f"[ALERT:{kind}] {msg}", flush=True)
          if ALERT_WEBHOOK:
              try:
                  requests.post(ALERT_WEBHOOK, json={"account": ACCOUNT, "kind": kind, "message": msg}, timeout=10)
              except requests.RequestException:
                  pass


      class RiskDetected(Exception):
          pass


      def reap(acc_id):
          """Zaseknuté úlohy (lease vypršal) vráť do fronty alebo označ ako failed."""
          q("""UPDATE tasks SET status = CASE WHEN attempts >= max_attempts THEN 'failed' ELSE 'pending' END,
                      result = 'lease expired'
               WHERE account_id=%s AND status='in_progress' AND lease_expires_at < now()""", (acc_id,))


      def allowed_actions(acc):
          done_hour = q("""SELECT count(*) c FROM tasks WHERE account_id=%s AND status='done'
                           AND finished_at > now() - interval '1 hour'""", (acc["id"],), one=True)["c"]
          if done_hour >= acc["hourly_action_limit"]:
              return []
          out = []
          if acc["likes_today"] < acc["daily_like_limit"]:
              out.append("like")
          if acc["comments_today"] < acc["daily_comment_limit"]:
              out.append("comment")
          return out


      def claim(acc_id, actions):
          return q("""WITH t AS (
                        SELECT id FROM tasks
                        WHERE account_id=%s AND status='pending' AND action = ANY(%s)
                          AND (not_before IS NULL OR not_before <= now())
                          AND (action='like' OR approved_at IS NOT NULL)   -- komentár len po schválení
                        ORDER BY priority DESC, created_at
                        FOR UPDATE SKIP LOCKED LIMIT 1)
                      UPDATE tasks SET status='in_progress', started_at=now(), attempts=attempts+1,
                             lease_expires_at = now() + (%s || ' minutes')::interval
                      FROM t WHERE tasks.id = t.id RETURNING tasks.*""",
                   (acc_id, actions, str(LEASE_MIN)), one=True)


      def target_ok(task):
          """Obrana do hĺbky: doména instagram.com + blacklist sa kontroluje aj vo workeri. Cieľ určuje operátor príkazom."""
          url = task["post_url"].strip()
          host = urlparse(url).netloc.lower()
          if host not in ("www.instagram.com", "instagram.com"):
              return False, "post_url nie je instagram.com"
          for b in q("SELECT kind,value FROM blacklist"):
              if b["kind"] == "post_url" and b["value"] == url:
                  return False, "post_url na blackliste"
              if b["kind"] == "word" and task.get("comment_text") and b["value"].lower() in task["comment_text"].lower():
                  return False, f"blacklist slovo: {b['value']}"
          return True, ""


      def check_risk(page):
          if any(p in page.url for p in RISK_URL_PARTS):
              raise RiskDetected(f"redirect na {page.url}")
          # odhlásená session / login stena
          if page.query_selector('input[name="username"]') and page.query_selector('input[name="password"]'):
              raise RiskDetected("odhlásená session (zobrazený login formulár)")
          # texty hľadáme len v dialógoch a alertoch, nie v komentároch používateľov
          try:
              texts = page.eval_on_selector_all('[role="dialog"], [role="alert"]', "els => els.map(e => e.innerText)")
          except Exception:
              texts = []
          blob = " ".join(texts).lower()
          for t in RISK_TEXTS:
              if t in blob:
                  raise RiskDetected(f"dialóg na stránke: {t}")


      def pause(acc):
          time.sleep(random.uniform(float(acc["pause_min_s"]), float(acc["pause_max_s"])))


      def heartbeat(acc_id):
          q("UPDATE accounts SET last_seen=now() WHERE id=%s", (acc_id,))
          open(HEARTBEAT_FILE, "w").write(str(time.time()))


      def in_window(acc):
          r = q("""SELECT (now() AT TIME ZONE tz)::time BETWEEN active_from AND active_to AS ok
                   FROM accounts WHERE id=%s""", (acc["id"],), one=True)
          return r["ok"]


      class AmbiguousSubmit(Exception):
          """Komentár mohol byť odoslaný, ale overenie zlyhalo. NIKDY sa neopakuje automaticky (hrozí duplicita)."""


      def do_task(page, task, acc):
          dry = acc["dry_run"]
          page.goto(task["post_url"], wait_until="domcontentloaded", timeout=45000)
          page.wait_for_timeout(2500)
          check_risk(page)
          if task["action"] == "like":
              if page.locator(SEL["unlike"]).count():
                  return "already_liked"
              icon = page.locator(SEL["like"]).first
              if not icon.count():
                  raise RuntimeError("like button not found")
              if dry:
                  return "dry_run: like button found"
              icon.locator('xpath=ancestor::*[self::button or @role="button"][1]').click(timeout=8000)
              page.wait_for_selector(SEL["unlike"], timeout=8000)
              return "liked"

          box = page.locator(SEL["comment"]).first
          box.wait_for(timeout=10000)
          box.click()
          box.fill(task["comment_text"])
          if dry:
              shot(page, task["id"], "dryrun_comment")
              box.fill("")
              return "dry_run: comment box found, text not submitted"
          pause(acc)
          try:   # od tohto momentu už komentár mohol odísť – žiadne automatické opakovanie
              btn = page.locator("form:has(" + SEL["comment"] + ")").get_by_role("button", name=POST_LABEL, exact=True)
              if btn.count():
                  btn.first.click(timeout=5000)
              else:
                  box.press("Enter")
              page.wait_for_timeout(3500)
              check_risk(page)
              page.get_by_text(task["comment_text"][:60], exact=False).first.wait_for(timeout=8000)
          except RiskDetected:
              raise
          except Exception as e:
              raise AmbiguousSubmit(f"nepodarilo sa overiť odoslanie komentára: {e}")
          return "commented"


      def shot(page, task_id, tag):
          path = f"{SHOT_DIR}/{ACCOUNT}_{task_id}_{tag}_{datetime.datetime.utcnow():%Y%m%dT%H%M%S}.png"
          try:
              page.screenshot(path=path)
              return path
          except Exception:
              return None


      def set_risk(acc_id, task, reason, page):
          path = shot(page, task["id"], "risk")
          q("UPDATE accounts SET status='risk', risk_reason=%s WHERE id=%s", (reason, acc_id))
          q("UPDATE tasks SET status='pending', result=%s, attempts=attempts-1 WHERE id=%s", ("risk: " + reason, task["id"]))
          log(task["id"], acc_id, "risk", reason, path)
          alert("risk", f"{ACCOUNT} -> risk: {reason}")


      def main():
          acc = q("SELECT * FROM accounts WHERE ig_username=%s", (ACCOUNT,), one=True)
          if not acc:
              sys.exit(f"účet {ACCOUNT} nie je v DB")
          proxy = None
          if os.environ.get("PROXY_SERVER"):
              proxy = {"server": os.environ["PROXY_SERVER"],
                       "username": os.environ.get("PROXY_USER", ""), "password": os.environ.get("PROXY_PASS", "")}

          with sync_playwright() as p:
              ctx = p.chromium.launch_persistent_context(
                  PROFILE_DIR, headless=HEADLESS, proxy=proxy,
                  locale=os.environ.get("LOCALE", "en-US"), viewport={"width": 1920, "height": 1080})
              page = ctx.pages[0] if ctx.pages else ctx.new_page()
              stealth_sync(page)
              page.add_init_script("""
      (() => {
        const getParameter = WebGLRenderingContext.prototype.getParameter;
        WebGLRenderingContext.prototype.getParameter = function(parameter) {
          if (parameter === 37445) return 'Google Inc. (NVIDIA)';
          if (parameter === 37446) return 'ANGLE (NVIDIA, NVIDIA GeForce GTX 1660 Ti Direct3D11 vs_5_0 ps_5_0, D3D11)';
          return getParameter.apply(this, arguments);
        };
        if (typeof WebGL2RenderingContext !== 'undefined') {
          const getParameter2 = WebGL2RenderingContext.prototype.getParameter;
          WebGL2RenderingContext.prototype.getParameter = function(parameter) {
            if (parameter === 37445) return 'Google Inc. (NVIDIA)';
            if (parameter === 37446) return 'ANGLE (NVIDIA, NVIDIA GeForce GTX 1660 Ti Direct3D11 vs_5_0 ps_5_0, D3D11)';
            return getParameter2.apply(this, arguments);
          };
        }
      })();
      """)

              if len(sys.argv) > 1 and sys.argv[1] == "login":
                  page.goto("https://www.instagram.com/")
                  print("Prihlás sa ručne (vrátane 2FA). Po dokončení klikni Hotovo v rozhraní.", flush=True)
                  import signal
                  stop = {"v": False}
                  signal.signal(signal.SIGTERM, lambda *a: stop.update(v=True))
                  while ctx.pages and not stop["v"]:
                      time.sleep(1)
                  ctx.close()          # korektné ukončenie: uloží cookies/profil
                  return

              while True:
                  acc = q("SELECT * FROM accounts WHERE id=%s", (acc["id"],), one=True)
                  heartbeat(acc["id"])
                  reap(acc["id"])
                  if acc["status"] != "active" or not acc["brand_disclosed"] or not in_window(acc):
                      time.sleep(IDLE_SLEEP); continue
                  actions = allowed_actions(acc)
                  task = claim(acc["id"], actions) if actions else None
                  if not task:
                      time.sleep(IDLE_SLEEP); continue
                  log(task["id"], acc["id"], "claimed")
                  try:
                      ok, why = target_ok(task)
                      if not ok:
                          q("UPDATE tasks SET status='failed', finished_at=now(), result=%s WHERE id=%s", (why, task["id"]))
                          log(task["id"], acc["id"], "failed", why); continue
                      result = do_task(page, task, acc)
                      path = shot(page, task["id"], "done")
                      if acc["dry_run"]:   # dry-run nespotrebuje limity; úloha sa zruší, aby sa dala zadať znova
                          q("UPDATE tasks SET status='cancelled', finished_at=now(), result=%s WHERE id=%s", (result, task["id"]))
                          log(task["id"], acc["id"], "dry_run", None, path)
                      else:
                          col = "likes_today" if task["action"] == "like" else "comments_today"
                          q(f"UPDATE accounts SET {col}={col}+1, last_action_at=now() WHERE id=%s", (acc["id"],))
                          q("UPDATE tasks SET status='done', finished_at=now(), result=%s WHERE id=%s", (result, task["id"]))
                          log(task["id"], acc["id"], "done", None, path)
                  except AmbiguousSubmit as e:   # nespoľahlivé: označ ako failed, operátor overí ručne
                      path = shot(page, task["id"], "ambiguous")
                      q("UPDATE tasks SET status='failed', finished_at=now(), result=%s WHERE id=%s", ("OVERIŤ RUČNE: " + str(e)[:400], task["id"]))
                      log(task["id"], acc["id"], "ambiguous", str(e)[:500], path)
                      alert("ambiguous", f"{ACCOUNT}: komentár #{task['id']} – over ručne na IG, či sa zverejnil")
                  except RiskDetected as e:
                      set_risk(acc["id"], task, str(e), page)   # zastav, nepokračuj, čaká na ručné odblokovanie
                  except Exception as e:  # PWTimeout, RuntimeError, ...
                      path = shot(page, task["id"], "err")
                      final = task["attempts"] >= task["max_attempts"]
                      q("UPDATE tasks SET status=%s, finished_at=CASE WHEN %s THEN now() END, result=%s WHERE id=%s",
                        ("failed" if final else "pending", final, str(e)[:500], task["id"]))
                      log(task["id"], acc["id"], "failed" if final else "retry", str(e)[:500], path)
                  pause(acc)


      if __name__ == "__main__":
          main()
  f_worker_login_sh:
    content: |
      #!/bin/bash
      # Ručné prihlásenie účtu v kontajneri s virtuálnym displejom, dostupné cez noVNC na porte 6080.
      # Spúšťa ho webové rozhranie (tlačidlo „Prihlásiť“). noVNC je dostupné len cez autentifikovaný Caddy (/novnc/).
      export DISPLAY=:99 HEADLESS=false
      Xvfb :99 -screen 0 1400x1000x24 &
      sleep 2
      openbox &                                   # jednoduchý správca okien (fokus klávesnice, zatváracie tlačidlo)
      x11vnc -display :99 -nopw -localhost -forever -shared -rfbport 5900 -bg -quiet
      websockify --web /usr/share/novnc 6080 localhost:5900 &
      python worker.py login &
      PY=$$!
      trap 'kill -TERM $$PY 2>/dev/null' TERM INT   # docker stop -> korektné zatvorenie prehliadača
      wait $$PY; wait $$PY 2>/dev/null
