# One remote Chromium browser whose traffic all leaves through NordVPN.
# Watch and drive it from your own browser at https://<host-ip>:${PORT}/
# (3101 by default).
#
# The browser has no network of its own: it joins the network of the `vpn`
# container (gluetun), which holds the NordVPN WireGuard tunnel. gluetun's
# firewall drops anything that is not going through the tunnel, so if the VPN
# drops, the browser goes offline instead of falling back to this host's IP.
# DNS is resolved by gluetun too. Sites see a NordVPN address, never this host.
#
# The viewer port is published on `vpn`, not on `chromium`, because that is the
# network the browser listens on. Only you reach it, from this host's network:
# replies to the viewer go back out the normal way, not through the tunnel.
#
# NordVPN key, needed once: in your Nord Account open NordVPN > "Set up NordVPN
# manually", generate an access token, then on any machine run
#
#   curl -s -u token:<ACCESS_TOKEN> https://api.nordvpn.com/v1/users/services/credentials
#
# and put the "nordlynx_private_key" value from the reply in NORDVPN_PRIVATE_KEY.
# It is not your account password.
#
# HTTPS, not HTTP: the image (linuxserver/chromium, Selkies-based) streams the
# screen with WebCodecs, which browsers only allow on a secure page. The
# certificate is self-signed, so expect a warning the first time. The image's
# plain-HTTP port 3000 is meant for a reverse proxy only and is not published.
#
# Anyone who reaches the port gets a working browser with whatever is signed in
# inside it. That is why CUSTOM_USER and PASSWORD (HTTP basic auth) are required.
#
# Budget about 1 GB of RAM for the browser, more for heavy pages.
services:
  vpn:
    # Floating major tag: follows every 3.x release.
    image: qmcgaw/gluetun:${VPN_TAG:-v3}
    container_name: ${CNTNR:-chromium}-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${PORT:-3101}:3001"
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${NORDVPN_PRIVATE_KEY:?set NORDVPN_PRIVATE_KEY to your NordLynx private key}
      # Comma-separated, e.g. "Germany" or "Slovakia,Czech Republic".
      # Empty picks any NordVPN server worldwide.
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-}
      SERVER_CITIES: ${VPN_CITIES:-}

  chromium:
    image: lscr.io/linuxserver/chromium:${TAG:-latest}
    container_name: ${CNTNR:-chromium}
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        # Start only once the tunnel is up, and restart with `vpn`: a browser
        # left on a replaced vpn container would have no network at all.
        condition: service_healthy
        restart: true
    # A ceiling on /dev/shm, not memory set aside: only what Chromium actually
    # writes there uses RAM. The image's docs: modern sites break without it.
    shm_size: "1gb"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      CUSTOM_USER: ${CUSTOM_USER:?set CUSTOM_USER for the viewer login}
      PASSWORD: ${PASSWORD:?set PASSWORD for the viewer login}
      CHROME_CLI: ${URL:?set URL to the page the browser opens}
    volumes:
      - ${DIR:-/home/administrator/chromium}/1:/config
