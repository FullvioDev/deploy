      def _vpn_fields(mode, country, city, hostname):
          mode = mode if mode in ("nordvpn", "none") else "nordvpn"
          country, city, hostname = country.strip(), city.strip(), hostname.strip().lower()
          if mode == "nordvpn" and not country:
              raise ValueError("Zadaj krajinu servera NordVPN (napr. Slovakia).")
          if hostname and not re.match(r"^[a-z0-9.-]+\.nordvpn\.com$$", hostname):
              raise ValueError("Hostname servera musí mať tvar napr. sk123.nordvpn.com")
          return mode, country, city, hostname


