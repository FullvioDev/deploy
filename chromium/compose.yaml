  wf_05:
    content: |
      {
        "name": "05 Monitor",
        "nodes": [
          {
            "parameters": {
              "rule": {
                "interval": [
                  {
                    "field": "cronExpression",
                    "expression": "*/5 * * * *"
                  }
                ]
              }
            },
            "name": "Every 5 min",
            "type": "n8n-nodes-base.scheduleTrigger",
            "typeVersion": 1.2,
            "position": [
              0,
              0
            ],
            "id": "289e3c67-dcf2-46ec-bec7-8831e6308984"
          },
          {
            "parameters": {
              "operation": "executeQuery",
              "query": "SELECT\n (SELECT coalesce(count(*) FILTER (WHERE status='failed')::float/NULLIF(count(*),0),0) FROM tasks WHERE finished_at > now()-interval '1 hour' AND status IN ('done','failed')) AS fail_rate,\n (SELECT coalesce(string_agg(ig_username, ', '),'') FROM accounts WHERE status='active' AND (last_seen IS NULL OR last_seen < now()-interval '10 minutes')) AS silent;",
              "options": {}
            },
            "name": "Health query",
            "type": "n8n-nodes-base.postgres",
            "typeVersion": 2.5,
            "position": [
              220,
              0
            ],
            "credentials": {
              "postgres": {
                "id": "pgigagents",
                "name": "Postgres igagents"
              }
            },
            "id": "365ed476-3cb7-4fe7-b04f-be0730463dca"
          },
          {
            "parameters": {
              "jsCode": "const r = $$json; const msgs = [];\nif (r.fail_rate > 0.2) msgs.push('Podiel zlyhaných úloh za poslednú hodinu: ' + Math.round(r.fail_rate*100) + ' %');\nif (r.silent) msgs.push('Worker nereaguje 10+ min: ' + r.silent);\nreturn msgs.length ? [{ json: { msg: '⚠️ ' + msgs.join('\\n') } }] : [];"
            },
            "name": "Evaluate",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              440,
              0
            ],
            "id": "a6569a19-5b50-4e06-b8af-d22126c35276"
          },
          {
            "parameters": {
              "method": "POST",
              "url": "={{ $$env.NOTIFY_URL }}",
              "sendBody": true,
              "specifyBody": "json",
              "jsonBody": "={{ JSON.stringify({ text: $$json.msg, chat_id: $$env.TELEGRAM_CHAT_ID || undefined }) }}"
            },
            "name": "Notify monitor",
            "type": "n8n-nodes-base.httpRequest",
            "typeVersion": 4.2,
            "position": [
              660,
              0
            ],
            "id": "d52d94e5-b22c-42d9-b073-037708dd7553"
          }
        ],
        "connections": {
          "Every 5 min": {
            "main": [
              [
                {
                  "node": "Health query",
                  "type": "main",
                  "index": 0
                }
              ]
            ]
          },
          "Health query": {
            "main": [
              [
                {
                  "node": "Evaluate",
                  "type": "main",
                  "index": 0
                }
              ]
            ]
          },
          "Evaluate": {
            "main": [
              [
                {
                  "node": "Notify monitor",
                  "type": "main",
                  "index": 0
                }
              ]
            ]
          }
        },
        "settings": {},
        "id": "igmonitor",
        "active": false
      }
