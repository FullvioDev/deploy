      def remove_container(name):
          if not dc: return
          try:
              dc.containers.get(name).remove(force=True)
          except docker.errors.NotFound:
              pass


      def stop_remove(name, timeout=30):
          """Korektné zastavenie (SIGTERM, počká na uloženie profilu), potom odstránenie."""
          if not dc: return
          try: c = dc.containers.get(name)
          except docker.errors.NotFound: return
          try: c.stop(timeout=timeout)
          except Exception: pass
          try: c.remove(force=True)
          except Exception: pass


      # ---- NordVPN cez gluetun (WireGuard / NordLynx). Každý účet má vlastný VPN kontajner s vnútornou HTTP proxy;
      # ---- worker ide cez ňu. Keď VPN nebeží, worker nemá spojenie (nikdy nejde z IP servera).
      def vpn_env(country, city, hostname, key):
          env = {"VPN_SERVICE_PROVIDER": "nordvpn", "VPN_TYPE": "wireguard", "WIREGUARD_PRIVATE_KEY": key,
                 "HTTPPROXY": "on", "HTTPPROXY_LISTENING_ADDRESS": f":{VPN_PORT}", "TZ": os.environ.get("TZ", "Etc/UTC")}
          if country: env["SERVER_COUNTRIES"] = country
          if city: env["SERVER_CITIES"] = city
          if hostname: env["SERVER_HOSTNAMES"] = hostname
          return env


      def exit_ip(proxy_url):
          last = None
          for _ in range(4):
              try:
                  return requests.get("https://api.ipify.org", proxies={"http": proxy_url, "https": proxy_url}, timeout=15).text.strip()
              except Exception as e:
                  last = e; time.sleep(3)
          raise RuntimeError(f"cez VPN sa nepodarilo zistiť výstupnú IP: {last}")


      def ensure_vpn(name, country, city, hostname, timeout=150):
          """Spustí (alebo znova použije) kontajner gluetun s NordVPN. Vráti (proxy_url, výstupná_IP)."""
          if not dc: raise RuntimeError("Docker nie je dostupný")
          key = get_setting("vpn_wg_key")
          if not key: raise RuntimeError("Chýba NordVPN WireGuard kľúč. Nastav ho v menu „VPN“.")
          env = vpn_env(country, city, hostname, key)
          cfg = hashlib.sha1(json.dumps(env, sort_keys=True).encode()).hexdigest()[:16]
          c = None
          try:
              c = dc.containers.get(name)
              if c.labels.get("ig.vpncfg") != cfg or c.status != "running":
                  c.remove(force=True); c = None
          except docker.errors.NotFound:
              pass
          if c is None:
              c = dc.containers.run(VPN_IMAGE, name=name, detach=True, cap_add=["NET_ADMIN"],
                                    devices=["/dev/net/tun:/dev/net/tun"], environment=env, network=NET,
                                    restart_policy={"Name": "unless-stopped"}, labels={"ig.vpn": name, "ig.vpncfg": cfg, "traefik.enable": "false"})
          t0 = time.time()
          while True:
              c.reload()
              tail = lambda: c.logs(tail=6).decode(errors="ignore")[-400:]
              if c.status in ("exited", "dead"):
                  raise RuntimeError("VPN kontajner skončil: " + tail())
              if c.attrs.get("State", {}).get("Health", {}).get("Status") == "healthy":
                  break
              if time.time() - t0 > timeout:
                  raise RuntimeError(f"VPN sa nepripojila do {timeout} s: " + tail())
              time.sleep(3)
          proxy = f"http://{name}:{VPN_PORT}"
          return proxy, exit_ip(proxy)


      def vpn_up(acc):
          """Zabezpečí VPN pre účet. Vráti (proxy_url, výstupná_IP); pri režime bez VPN ('', '')."""
          if acc["vpn_mode"] != "nordvpn": return "", ""
          proxy, ip = ensure_vpn(vname(acc["ig_username"]), acc["vpn_country"], acc["vpn_city"], acc["vpn_hostname"])
          db("UPDATE accounts SET exit_ip=%s WHERE id=%s", (ip, acc["id"]))
          return proxy, ip


      def dup_ip_warning(acc, ip):
          if not ip: return ""
          rows = db("SELECT ig_username FROM accounts WHERE exit_ip=%s AND id<>%s AND NOT archived", (ip, acc["id"]))
          return (f" POZOR: rovnakú výstupnú IP {ip} má aj " + ", ".join(r["ig_username"] for r in rows) +
                  ". Nastav inú krajinu/mesto/server.") if rows else ""


      def start_worker(acc):
          """Spustí VPN (ak je zapnutá) a worker účtu. Vráti prípadné varovanie."""
          if not dc: raise RuntimeError("Docker nie je dostupný")
          require_worker_image()
          u = acc["ig_username"]
          proxy, ip = vpn_up(acc)
          remove_container(wname(u))
          os.makedirs(f"{DATA_ROOT}/{u}", exist_ok=True)
          dc.containers.run(IMAGE, name=wname(u), hostname=wname(u), detach=True, environment=account_env(acc, proxy),
                            network=NET, shm_size="1g", restart_policy={"Name": "unless-stopped"},
                            volumes={f"{HOST_DATA}/{u}": {"bind": "/data", "mode": "rw"}},
                            labels={"ig.managed": "1", "ig.account": u, "traefik.enable": "false"})
          return dup_ip_warning(acc, ip)


      def vpn_states():
          if not dc: return {}
          out = {}
          for c in dc.containers.list(all=True, filters={"label": "ig.vpn"}):
              name = c.labels.get("ig.vpn", "")
              if name.startswith("ig-vpn-") and name != VPN_TEST:
                  health = c.attrs.get("State", {}).get("Health", {}).get("Status")
                  out[name[len("ig-vpn-"):]] = c.status + (f" ({health})" if health else "")
          return out


      def host_memory():
          try:
              m = {l.split(":")[0]: int(l.split()[1]) for l in open("/proc/meminfo")}
              return round(m["MemTotal"] / 1048576, 1), round(m["MemAvailable"] / 1048576, 1)
          except Exception:
              return None, None


