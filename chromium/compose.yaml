  f_manager_app_py:
    content: |
      """Webové rozhranie (manager): správa účtov, workerov, úloh a schvaľovania."""
      import asyncio, base64, hashlib, io, json, os, re, requests, secrets, tarfile, threading, time
      from contextlib import asynccontextmanager
      import psycopg2, psycopg2.extras
      from fastapi import FastAPI, Form, HTTPException, Request, WebSocket
      from fastapi.responses import FileResponse, HTMLResponse, PlainTextResponse, RedirectResponse, Response
      from fastapi.templating import Jinja2Templates

      import llm

      try:
          import docker
          dc = docker.from_env()
          dc.ping()
      except Exception:          # beh bez Dockera (napr. testy) – správa workerov je vtedy vypnutá
          docker, dc = None, None

      DSN = os.environ["DATABASE_URL"]
      WORKER_DSN = os.environ.get("WORKER_DATABASE_URL", "")
      IMAGE = os.environ.get("WORKER_IMAGE", "ig-worker:latest")
      NET = os.environ.get("NETWORK", "ig_net")
      HOST_DATA = os.environ.get("HOST_DATA_DIR", "/data-root")
      DATA_ROOT = "/data-root"
      N8N_URL = os.environ.get("N8N_URL", "http://n8n:5678")
      COMMAND_KEY = os.environ.get("COMMAND_KEY", "")
      LOGIN_NAME = "ig-login"
      APP_AUTH = os.environ.get("APP_AUTH", "off").lower() == "on"     # prihlasovanie (HTTP Basic) priamo v aplikácii; používa sa za Traefikom
      ADMIN_PASSWORD = os.environ.get("ADMIN_PASSWORD", "")
      LOGIN_UPSTREAM = os.environ.get("LOGIN_UPSTREAM", "ig-login:6080")
      VPN_IMAGE = os.environ.get("VPN_IMAGE", "qmcgaw/gluetun:v3")
      WORKER_SRC = os.environ.get("WORKER_SRC", "")          # priečinok so zdrojmi workera (Dockerfile, worker.py, login.sh, requirements.txt)
      BUILDER_IMAGE = os.environ.get("BUILDER_IMAGE", "docker:cli")
      build_state = {"status": "unknown", "log": ""}          # unknown | ready | building | failed
      VPN_PORT = 8888
      VPN_TEST = "ig-vpn-test"
      WG_KEY_RE = re.compile(r"^[A-Za-z0-9+/]{43}=$$")
      USER_RE = re.compile(r"^[A-Za-z0-9._]{1,30}$$")
      PassThrough = ("SEL_LIKE", "SEL_UNLIKE", "SEL_COMMENT", "POST_LABEL")

      def seed_from_env():
          """Počiatočné hodnoty z premenných prostredia (len ak sú tabuľky prázdne). Používa jednosúborový stack."""
          split = lambda v: [x.strip().lstrip("@") for x in (v or "").split(",") if x.strip()]
          try:
              if not db("SELECT 1 FROM blacklist LIMIT 1", one=True):
                  for w in [x.strip() for x in os.environ.get("BLACKLIST_WORDS", "").split(",") if x.strip()]:
                      db("INSERT INTO blacklist(kind,value) VALUES ('word',%s)", (w,))
              k = os.environ.get("NORDVPN_PRIVATE_KEY", "").strip()
              if k and WG_KEY_RE.match(k) and not db("SELECT 1 FROM settings WHERE key='vpn_wg_key'", one=True):
                  db("INSERT INTO settings(key,value) VALUES ('vpn_wg_key',%s)", (k,))
              m = os.environ.get("LOCAL_LLM_MODEL", "").strip()
              if m and not db("SELECT 1 FROM settings WHERE key='ai_provider'", one=True):
                  for k, v in (("ai_provider", "openai_compat"), ("ai_base_url", "http://ollama:11434/v1"), ("ai_model", m), ("ai_timeout_s", "600")):
                      db("INSERT INTO settings(key,value) VALUES (%s,%s) ON CONFLICT (key) DO NOTHING", (k, v))
          except Exception as e:
              print("seed_from_env:", e, flush=True)


      @asynccontextmanager
      async def lifespan(_app):
          seed_from_env()
          ensure_worker_image(background=True)
          yield


      app = FastAPI(lifespan=lifespan)
      templates = Jinja2Templates(directory="templates")


      def db(sql, args=None, one=False):
          conn = psycopg2.connect(DSN)
          conn.autocommit = True
          try:
              with conn.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
                  cur.execute(sql, args)
                  if cur.description:
                      return cur.fetchone() if one else cur.fetchall()
          finally:
              conn.close()


      def _key_protected(path):
          """Cesty chránené vlastnými kľúčmi (nie heslom/CSRF): API pre n8n a webhooky n8n."""
          return path.startswith(("/api/", "/webhook/", "/webhook-test/"))


      @app.middleware("http")
      async def csrf_guard(request: Request, call_next):
          if request.method == "POST" and not _key_protected(request.url.path):
              src = request.headers.get("origin") or request.headers.get("referer") or ""
              host = request.headers.get("x-forwarded-host") or request.headers.get("host") or ""
              if not host or host not in src:
                  return PlainTextResponse("CSRF kontrola zlyhala", status_code=403)
          return await call_next(request)


      def _auth_ok(header):
          """HTTP Basic: používateľ admin + ADMIN_PASSWORD. Bez nastaveného hesla je všetko zamknuté."""
          if not ADMIN_PASSWORD: return False
          try:
              scheme, _, b64 = (header or "").partition(" ")
              if scheme.lower() != "basic": return False
              user, _, pw = base64.b64decode(b64).decode().partition(":")
          except Exception:
              return False
          return secrets.compare_digest(user.encode(), b"admin") & secrets.compare_digest(pw.encode(), ADMIN_PASSWORD.encode())


      @app.middleware("http")
      async def basic_auth_guard(request: Request, call_next):
          if APP_AUTH and not _key_protected(request.url.path) and not _auth_ok(request.headers.get("authorization")):
              return Response("Vyžaduje sa prihlásenie", status_code=401, headers={"WWW-Authenticate": 'Basic realm="IG Brand Agents"'})
          return await call_next(request)


      def render(request, name, **ctx):
          ctx.setdefault("msg", request.query_params.get("msg"))
          ctx.setdefault("err", request.query_params.get("err"))
          ctx["docker_ok"] = dc is not None
          ctx["worker_build"] = dict(build_state)
          return templates.TemplateResponse(request, name, ctx)


      def back(url="/", msg=None, err=None):
          q = ""
          if msg: q = "?msg=" + requests.utils.quote(msg)
          if err: q = "?err=" + requests.utils.quote(err)
          return RedirectResponse(url.split("?")[0] + q, status_code=303)


      # ------------------------------------------------------------------ Docker
      def wname(u): return f"ig-worker-{u}"


      def worker_states():
          if not dc: return {}
          out = {}
          for c in dc.containers.list(all=True, filters={"label": "ig.managed=1"}):
              health = c.attrs.get("State", {}).get("Health", {}).get("Status")
              out[c.labels.get("ig.account")] = c.status + (f" ({health})" if health and c.status == "running" else "")
          return out


      def worker_image_ready():
          if not dc: return False
          try:
              dc.images.get(IMAGE); return True
          except docker.errors.ImageNotFound:
              return False
          except Exception:
              return False


      def _src_tar():
          """Zdroje workera ako tar pre kontajner zostavovača (priečinok /src)."""
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w") as t:
              d = tarfile.TarInfo("src"); d.type = tarfile.DIRTYPE; d.mode = 0o755; t.addfile(d)
              for name in ("Dockerfile", "worker.py", "login.sh", "requirements.txt"):
                  data = open(os.path.join(WORKER_SRC, name), "rb").read()
                  ti = tarfile.TarInfo("src/" + name); ti.size = len(data); ti.mode = 0o755 if name.endswith(".sh") else 0o644
                  t.addfile(ti, io.BytesIO(data))
          buf.seek(0)
          return buf.read()


      def _build_worker_image():
          build_state.update(status="building", log="Zostavuje sa obraz workera (prvýkrát 5 – 15 min)…")
          name = "ig-worker-builder"
          try:
              remove_container(name)
              try: dc.images.get(BUILDER_IMAGE)
              except docker.errors.ImageNotFound:
                  build_state["log"] = f"Sťahujem {BUILDER_IMAGE}…"; dc.images.pull(BUILDER_IMAGE)
                  build_state["log"] = "Zostavuje sa obraz workera (5 – 15 min)…"
              c = dc.containers.create(BUILDER_IMAGE, name=name, working_dir="/src", entrypoint=["/bin/sh", "-c"],
                                       command=[f"docker build -t {IMAGE} ."],
                                       volumes={"/var/run/docker.sock": {"bind": "/var/run/docker.sock", "mode": "rw"}})
              c.put_archive("/", _src_tar())
              c.start()
              res = c.wait()
              code = res.get("StatusCode", 1) if isinstance(res, dict) else 1
              tail = c.logs(tail=15).decode(errors="ignore")[-900:]
              remove_container(name)
              if code == 0 and worker_image_ready():
                  build_state.update(status="ready", log="")
              else:
                  build_state.update(status="failed", log=f"Zostavenie obrazu zlyhalo (kód {code}): {tail}")
          except Exception as e:
              build_state.update(status="failed", log=f"Zostavenie obrazu zlyhalo: {e}")


      def ensure_worker_image(background=True):
          """Ak obraz workera neexistuje a sú dostupné zdroje, zostaví ho (na pozadí). Inak len zistí stav."""
          if not dc:
              return
          if worker_image_ready():
              build_state.update(status="ready", log=""); return
          if not WORKER_SRC or not os.path.isfile(os.path.join(WORKER_SRC, "Dockerfile")):
              build_state.update(status="failed", log=f"Obraz {IMAGE} neexistuje a nie sú dostupné zdroje na jeho zostavenie."); return
          if build_state["status"] == "building":
              return
          if background:
              threading.Thread(target=_build_worker_image, daemon=True).start()
          else:
              _build_worker_image()


      def require_worker_image():
