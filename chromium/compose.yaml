              "jsonBody": "={{ JSON.stringify({ text: '📊 Denný report\\nhotové: '+$$json.done+'\\nzlyhané: '+$$json.failed+'\\nčakajú na schválenie: '+$$json.waiting+'\\núčty v riziku: '+$$json.risk, chat_id: $$env.TELEGRAM_CHAT_ID || undefined }) }}"
            },
            "name": "Send report",
            "type": "n8n-nodes-base.httpRequest",
            "typeVersion": 4.2,
            "position": [
              440,
              0
            ],
            "id": "851ab555-c292-4974-bd01-e6ebfa18739c"
          }
        ],
