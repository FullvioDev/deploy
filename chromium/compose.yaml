      {
        "name": "04 Daily report",
        "nodes": [
          {
            "parameters": {
              "rule": {
                "interval": [
                  {
                    "field": "cronExpression",
                    "expression": "0 20 * * *"
                  }
                ]
              }
            },
            "name": "Cron 20:00",
            "type": "n8n-nodes-base.scheduleTrigger",
            "typeVersion": 1.2,
            "position": [
              0,
              0
            ],
            "id": "ace4c165-b7dc-4b1a-81e0-320f59a31dc9"
          },
          {
            "parameters": {
              "operation": "executeQuery",
              "query": "SELECT\n (SELECT count(*) FROM tasks WHERE finished_at::date=current_date AND status='done') AS done,\n (SELECT count(*) FROM tasks WHERE finished_at::date=current_date AND status='failed') AS failed,\n (SELECT count(*) FROM tasks WHERE status='awaiting_approval') AS waiting,\n (SELECT coalesce(string_agg(ig_username||' ('||coalesce(risk_reason,'?')||')', ', '),'-') FROM accounts WHERE status='risk') AS risk;",
              "options": {}
            },
            "name": "Stats",
            "type": "n8n-nodes-base.postgres",
            "typeVersion": 2.5,
            "position": [
              220,
              0
            ],
