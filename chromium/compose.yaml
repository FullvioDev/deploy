          return Response(r.content, status_code=r.status_code, media_type=r.headers.get("content-type"))


      @app.websocket("/novnc/websockify")
      async def novnc_ws(ws: WebSocket):
          if APP_AUTH and not _auth_ok(ws.headers.get("authorization")):
              await ws.close(code=1008); return
          import websockets
          subs = ws.scope.get("subprotocols", [])
          try:
              up = await websockets.connect(f"ws://{LOGIN_UPSTREAM}/websockify", subprotocols=subs or None, max_size=None)
          except Exception:
              await ws.close(code=1011); return
          await ws.accept(subprotocol=(up.subprotocol or (subs[0] if subs else None)))

          async def c2u():
              try:
                  while True:
                      m = await ws.receive()
                      if m["type"] == "websocket.disconnect": break
                      if m.get("bytes") is not None: await up.send(m["bytes"])
                      elif m.get("text") is not None: await up.send(m["text"])
              except Exception:
                  pass

          async def u2c():
              try:
                  async for msg in up:
                      if isinstance(msg, bytes): await ws.send_bytes(msg)
                      else: await ws.send_text(msg)
              except Exception:
                  pass

          tasks = [asyncio.create_task(c2u()), asyncio.create_task(u2c())]
          await asyncio.wait(tasks, return_when=asyncio.FIRST_COMPLETED)
          for t in tasks: t.cancel()
          try: await up.close()
          except Exception: pass
          try: await ws.close()
          except Exception: pass


