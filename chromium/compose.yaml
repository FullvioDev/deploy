                        vstates=vpn_states(), accounts=db("SELECT ig_username, vpn_country, vpn_city, vpn_hostname, exit_ip FROM accounts WHERE NOT archived AND vpn_mode='nordvpn' ORDER BY id"))


      @app.post("/settings/vpn/save")
      def vpn_save(private_key: str = Form(""), access_token: str = Form(""), clear_key: str = Form("")):
          if clear_key:
              db("DELETE FROM settings WHERE key='vpn_wg_key'")
              return back("/settings/vpn", msg="Kľúč zmazaný. VPN kontajnery bežia, kým ich nezastavíš.")
          try:
              if access_token.strip():
                  key = fetch_nordlynx_key(access_token)
              elif private_key.strip():
                  key = private_key.strip()
                  if not WG_KEY_RE.match(key): raise ValueError("Neplatný WireGuard kľúč (očakáva sa 44 znakov base64 zakončených '=').")
              else:
                  return back("/settings/vpn", err="Vlož kľúč alebo access token.")
          except Exception as e:
              return back("/settings/vpn", err=str(e))
          put_setting("vpn_wg_key", key)
          return back("/settings/vpn", msg="NordVPN kľúč uložený.")


      @app.post("/settings/vpn/test")
      def vpn_test(country: str = Form(...), city: str = Form("")):
          try:
              proxy, ip = ensure_vpn(VPN_TEST, country.strip(), city.strip(), "")
              stop_remove(VPN_TEST, timeout=10)
              return back("/settings/vpn", msg=f"NordVPN funguje. Výstupná IP: {ip} ({country.strip()}).")
          except Exception as e:
              stop_remove(VPN_TEST, timeout=5)
              return back("/settings/vpn", err=f"Test VPN zlyhal: {e}")


      # ------------------------------------------------------------------ AI model + šéf-agent
      PROMPT_FILE = "/prompts/boss_agent.md"
      MAX_TASKS = 20
      MAX_COMMENT = 300
      URL_RE = re.compile(r"^https://(www\.)?instagram\.com/(?:[A-Za-z0-9._]+/)?(p|reel|tv)/[A-Za-z0-9_-]+/?$$")


      def ai_cfg():
          db("CREATE TABLE IF NOT EXISTS settings (key text PRIMARY KEY, value text NOT NULL)")
          cfg = dict(llm.DEFAULTS)
          stored = {r["key"]: r["value"] for r in db("SELECT key,value FROM settings WHERE key LIKE 'ai\\_%'")}
          cfg.update(stored)
          # kľúč z prostredia sa použije len pre Claude na oficiálnej adrese, nikdy pre iný server
          if not cfg["ai_api_key"] and cfg["ai_provider"] == "anthropic" and not cfg["ai_base_url"] and os.environ.get("ANTHROPIC_API_KEY"):
              cfg["ai_api_key"] = os.environ["ANTHROPIC_API_KEY"]
          return cfg


      def default_prompt():
          try: return open(PROMPT_FILE, encoding="utf-8").read()
          except Exception: return "Si šéf-agent. Vráť iba JSON {\"tasks\": [], \"rejected\": [], \"notes\": \"\"}."


      def get_prompt():
          row = db("SELECT value FROM settings WHERE key='ai_prompt'", one=True)
          return row["value"] if row and row["value"].strip() else default_prompt()


      def agent_context():
          accounts = db("""SELECT a.id, a.ig_username AS username,
              a.daily_like_limit - a.likes_today - coalesce(q.likes,0) AS likes_left,
              a.daily_comment_limit - a.comments_today - coalesce(q.comments,0) AS comments_left
              FROM accounts a LEFT JOIN (SELECT account_id, count(*) FILTER (WHERE action='like') likes,
                   count(*) FILTER (WHERE action='comment') comments FROM tasks
                   WHERE status IN ('pending','awaiting_approval','in_progress') GROUP BY 1) q ON q.account_id=a.id
              WHERE NOT a.archived AND a.status='active' AND a.brand_disclosed ORDER BY a.id""")
          return {"accounts": accounts,
                  "blacklist": [{"kind": r["kind"], "value": r["value"]} for r in db("SELECT kind,value FROM blacklist")],
                  "recent_comments": [r["comment_text"] for r in db(
                      "SELECT comment_text FROM tasks WHERE action='comment' ORDER BY id DESC LIMIT 40")]}


      def plan_and_create(command, requested_by):
          """Príkaz -> LLM -> prísna kontrola v kóde -> úlohy v DB. Bezpečnostné pravidlá nezávisia od kvality modelu."""
          cfg = ai_cfg()
          ctx = agent_context()
          if not ctx["accounts"]:
              raise llm.LLMError("Žiadny aktívny značkový účet. Aktivuj aspoň jeden účet.")
          public_ctx = {k: ([{kk: vv for kk, vv in a.items() if kk != "id"} for a in v] if k == "accounts" else v) for k, v in ctx.items()}
          user = ("PRÍKAZ OPERÁTORA:\n" + command + "\n\nKONTEXT (JSON):\n" + json.dumps(public_ctx, ensure_ascii=False) +
                  "\n\nOdpovedz IBA jedným platným JSON objektom podľa zadaného formátu, bez ďalšieho textu.")
          system = get_prompt()
          out, last_err = None, None
          for attempt in range(2):                      # druhý pokus pri nevalidnom JSON (typické pre menšie lokálne modely)
              text, secs = llm.chat(cfg, system, user if attempt == 0 else user + "\n\nPredchádzajúca odpoveď nebola platný JSON. Vráť IBA JSON objekt.")
              try:
                  out = llm.extract_json(text); break
              except Exception as e:
                  last_err = e
          if out is None:
              raise llm.LLMError(f"Model nevrátil platný JSON ({last_err}). Skús schopnejší model.")

          by_name = {a["username"].lower(): a for a in ctx["accounts"]}
          black = ctx["blacklist"]
          left = {a["username"]: {"like": a["likes_left"], "comment": a["comments_left"]} for a in ctx["accounts"]}
          created, rejected = [], [{"post_url": str(r.get("post_url", "")), "reason": "model: " + str(r.get("reason", ""))}
                                    for r in (out.get("rejected") or []) if isinstance(r, dict)]
          for t in (out.get("tasks") or [])[:MAX_TASKS * 2]:
              if len(created) >= MAX_TASKS:
                  rejected.append({"post_url": str(t.get("post_url", "")), "reason": f"limit {MAX_TASKS} úloh na príkaz"}); continue
              try:
                  action = str(t.get("action", "")).strip()
                  acc = by_name.get(str(t.get("account", "")).strip().lstrip("@").lower())
                  url = str(t.get("post_url", "")).split("?")[0].split("#")[0].strip()
                  url = url if url.endswith("/") else url + "/"
                  text = (t.get("comment_text") or "").strip() if action == "comment" else None
                  ctxt = (str(t.get("post_context") or "").strip() or None)
                  why = None
                  if action not in ("like", "comment"): why = "neplatná akcia"
                  elif not acc: why = "účet neexistuje alebo nie je aktívny/značkový"
                  elif not URL_RE.match(url): why = "neplatná URL príspevku"
                  elif any(b["kind"] == "post_url" and b["value"].rstrip("/") == url.rstrip("/") for b in black): why = "príspevok je na blackliste"
                  elif left[acc["username"]][action] <= 0: why = "vyčerpaný limit účtu"
                  elif action == "comment":
                      if not text: why = "prázdny komentár"
                      elif len(text) > MAX_COMMENT: why = f"komentár dlhší ako {MAX_COMMENT} znakov"
                      elif re.search(r"https?://|www\.", text, re.I): why = "komentár obsahuje odkaz"
                      elif any(b["kind"] == "word" and b["value"].lower() in text.lower() for b in black): why = "slovo z blacklistu"
                      elif db("""SELECT 1 FROM tasks WHERE action='comment' AND post_url=%s
                                 AND status NOT IN ('failed','cancelled')""", (url,), one=True): why = "na tento príspevok už komentár existuje"
                  if why:
                      rejected.append({"post_url": url, "reason": why}); continue
                  row = db("""INSERT INTO tasks(account_id,post_url,post_context,action,comment_text,status,requested_by)
                              VALUES (%s,%s,%s,%s,%s,%s,%s) ON CONFLICT DO NOTHING RETURNING id""",
                           (acc["id"], url, ctxt, action, text, "awaiting_approval" if action == "comment" else "pending", requested_by), one=True)
                  if not row:
                      rejected.append({"post_url": url, "reason": "duplicita (rovnaký text alebo akcia už existuje)"}); continue
                  left[acc["username"]][action] -= 1
                  created.append({"id": row["id"], "account": acc["username"], "action": action, "post_url": url, "comment_text": text})
              except Exception as e:
                  rejected.append({"post_url": str(t.get("post_url", "")) if isinstance(t, dict) else "", "reason": f"chyba spracovania: {e}"})
          return {"created": created, "rejected": rejected, "notes": str(out.get("notes") or ""),
                  "model": f"{cfg['ai_provider']}/{cfg['ai_model']}", "seconds": round(secs, 1)}


      @app.post("/api/agent")                          # volá n8n (intake workflow); chránené kľúčom
      async def api_agent(request: Request):
          if not COMMAND_KEY or request.headers.get("x-api-key") != COMMAND_KEY:
              return PlainTextResponse("neautorizované", status_code=401)
          body = await request.json()
          try:
              return plan_and_create(str(body.get("command", "")), str(body.get("requested_by", "api")))
          except Exception as e:
              return PlainTextResponse(str(e), status_code=502)


      @app.post("/agent")
      def agent(command: str = Form(...)):
          try:
              r = plan_and_create(command, "gui")
          except Exception as e:
              return back("/", err=f"Šéf-agent zlyhal: {e}")
          msg = f"Vytvorených úloh: {len(r['created'])} (model {r['model']}, {r['seconds']} s)."
          if any(c["action"] == "comment" for c in r["created"]): msg += " Komentáre čakajú na schválenie."
          if r["rejected"]: msg += " Zamietnuté: " + "; ".join(f"{x['reason']}" for x in r["rejected"][:5])
          return back("/", msg=msg)


      @app.get("/settings/ai", response_class=HTMLResponse)
      def ai_page(request: Request):
          cfg = ai_cfg()
          return render(request, "ai.html", cfg=cfg, has_key=bool(cfg["ai_api_key"]), models=llm.list_models(cfg),
                        prompt=get_prompt(), custom_prompt=bool(db("SELECT 1 FROM settings WHERE key='ai_prompt'", one=True)))


      def _form_cfg(old, provider, base_url, model, api_key, temperature, max_tokens, timeout_s, json_mode):
          if provider not in llm.PROVIDERS: raise ValueError("Neplatný provider")
          if provider == "openai_compat" and not base_url.strip().startswith("http"): raise ValueError("Zadaj base URL (http://… alebo https://…)")
          if not model.strip(): raise ValueError("Zadaj názov modelu")
          if temperature.strip(): float(temperature)
          cfg = dict(old)
          cfg.update(ai_provider=provider, ai_base_url=base_url.strip(), ai_model=model.strip(), ai_temperature=temperature.strip(),
                     ai_max_tokens=str(int(max_tokens)), ai_timeout_s=str(int(timeout_s)), ai_json_mode="1" if json_mode else "0")
          if api_key:
              cfg["ai_api_key"] = api_key
          elif (old["ai_provider"], old["ai_base_url"].rstrip("/")) != (provider, base_url.strip().rstrip("/")):
              cfg["ai_api_key"] = ""        # zmena providera/adresy: starý kľúč sa NEPRENÁŠA na iný server
          return cfg


      @app.post("/settings/ai/save")
      def ai_save(provider: str = Form(...), base_url: str = Form(""), model: str = Form(...), api_key: str = Form(""),
                  temperature: str = Form(""), max_tokens: int = Form(2000), timeout_s: int = Form(180),
                  json_mode: str = Form(""), prompt: str = Form(""), clear_key: str = Form("")):
          old_cfg = ai_cfg()
          try:
              cfg = _form_cfg(old_cfg, provider, base_url, model, api_key, temperature, max_tokens, timeout_s, json_mode)
          except ValueError as e:
              return back("/settings/ai", err=str(e))
          if clear_key: cfg["ai_api_key"] = ""
          dropped = bool(old_cfg["ai_api_key"]) and not cfg["ai_api_key"] and not clear_key
          for k, v in cfg.items():
              if k.startswith("ai_"):
                  db("INSERT INTO settings(key,value) VALUES (%s,%s) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value", (k, v))
          if prompt.strip() and prompt.strip() != default_prompt().strip():
              db("INSERT INTO settings(key,value) VALUES ('ai_prompt',%s) ON CONFLICT (key) DO UPDATE SET value=EXCLUDED.value", (prompt,))
          else:
              db("DELETE FROM settings WHERE key='ai_prompt'")
          return back("/settings/ai", msg="Nastavenie AI modelu uložené." + (" Uložený API kľúč bol zmazaný, lebo sa zmenil provider/adresa. Zadaj nový, ak ho server vyžaduje." if dropped else ""))


      @app.post("/settings/ai/test")
      def ai_test(provider: str = Form(...), base_url: str = Form(""), model: str = Form(...), api_key: str = Form(""),
                  temperature: str = Form(""), max_tokens: int = Form(2000), timeout_s: int = Form(180), json_mode: str = Form("")):
          try:
              cfg = _form_cfg(ai_cfg(), provider, base_url, model, api_key, temperature, max_tokens, timeout_s, json_mode)
              text, secs = llm.chat(cfg, "Odpovedaj iba platným JSON objektom.", 'Vráť presne {"ok": true, "jazyk": "sk"} a nič iné.')
              try: llm.extract_json(text); fmt = "JSON je platný"
              except Exception: fmt = "POZOR: odpoveď nie je platný JSON – model môže byť pre šéf-agenta slabý"
              return back("/settings/ai", msg=f"Spojenie OK ({secs:.1f} s). {fmt}. Odpoveď: {text.strip()[:120]}")
          except Exception as e:
              return back("/settings/ai", err=f"Test zlyhal: {e}")


      # --- logy, screenshoty
      @app.get("/logs", response_class=HTMLResponse)
      def logs_page(request: Request):
          rows = db("""SELECT to_char(l.created_at,'MM-DD HH24:MI:SS') t, a.ig_username, l.task_id, l.event,
                              left(coalesce(l.error,''),160) error, l.screenshot_url
                       FROM logs l LEFT JOIN accounts a ON a.id=l.account_id ORDER BY l.id DESC LIMIT 200""")
          for r in rows:
              r["shot"] = os.path.basename(r["screenshot_url"]) if r["screenshot_url"] else None
          return render(request, "logs.html", rows=rows)


      @app.get("/shots/{username}/{fname}")
      def shot(username: str, fname: str):
          if not USER_RE.match(username) or "/" in fname or ".." in fname: return PlainTextResponse("nie", 400)
          path = f"{DATA_ROOT}/{username}/screenshots/{fname}"
          return FileResponse(path) if os.path.isfile(path) else PlainTextResponse("nenájdené", 404)


      # --- nastavenia: blacklist
      @app.get("/settings", response_class=HTMLResponse)
      def settings_page(request: Request):
          return render(request, "settings.html", black=db("SELECT * FROM blacklist ORDER BY id"))


      @app.post("/settings/black/add")
      def black_add(kind: str = Form(...), value: str = Form(...)):
          if kind not in ("word", "post_url") or not value.strip(): return back("/settings", err="Neplatný záznam")
          db("INSERT INTO blacklist(kind,value) VALUES (%s,%s)", (kind, value.strip()))
          return back("/settings", msg="Pridané do blacklistu.")


      @app.post("/settings/{table}/{rid}/delete")
      def setting_delete(table: str, rid: int):
          if table == "black": db("DELETE FROM blacklist WHERE id=%s", (rid,))
          return back("/settings", msg="Odstránené.")
  f_manager_llm_py:
    content: |
      """Jednotné rozhranie na AI modely: Anthropic (Claude) a ľubovoľné OpenAI-kompatibilné API
      (OpenAI, OpenRouter, ale aj lokálne: Ollama, LM Studio, vLLM, llama.cpp server)."""
      import json, re, time
      import requests

      PROVIDERS = ("anthropic", "openai_compat")
      DEFAULTS = {"ai_provider": "anthropic", "ai_base_url": "", "ai_model": "claude-sonnet-5-5", "ai_api_key": "",
                  "ai_temperature": "", "ai_max_tokens": "2000", "ai_timeout_s": "180", "ai_json_mode": "1"}


      class LLMError(Exception):
          pass


      def _post(url, headers, body, timeout):
          try:
              r = requests.post(url, headers=headers, json=body, timeout=timeout)
          except requests.RequestException as e:
              raise LLMError(f"spojenie zlyhalo: {e}")
          return r


      def chat(cfg, system, user):
          """Vráti (text, trvanie_s). Pri chybe vyhodí LLMError."""
          provider, model = cfg["ai_provider"], cfg["ai_model"].strip()
          if provider not in PROVIDERS: raise LLMError("neznámy provider")
          if not model: raise LLMError("model nie je zadaný")
          timeout = float(cfg.get("ai_timeout_s") or 180)
          max_tokens = int(cfg.get("ai_max_tokens") or 2000)
          temp = cfg.get("ai_temperature", "").strip()
          t0 = time.time()
          if provider == "anthropic":
              base = (cfg["ai_base_url"].strip() or "https://api.anthropic.com").rstrip("/")
              if not cfg["ai_api_key"]: raise LLMError("chýba API kľúč pre Anthropic")
              body = {"model": model, "max_tokens": max_tokens, "system": system, "messages": [{"role": "user", "content": user}]}
              if temp: body["temperature"] = float(temp)
              r = _post(base + "/v1/messages", {"x-api-key": cfg["ai_api_key"], "anthropic-version": "2023-06-01"}, body, timeout)
              if r.status_code >= 400: raise LLMError(f"HTTP {r.status_code}: {r.text[:300]}")
              text = "".join(b.get("text", "") for b in r.json().get("content", []) if b.get("type") == "text")
          else:
              base = cfg["ai_base_url"].strip().rstrip("/")
              if not base.startswith("http"): raise LLMError("chýba base URL (napr. http://ollama:11434/v1)")
              headers = {"Authorization": "Bearer " + cfg["ai_api_key"]} if cfg["ai_api_key"] else {}
              body = {"model": model, "max_tokens": max_tokens, "stream": False,
                      "messages": [{"role": "system", "content": system}, {"role": "user", "content": user}]}
              if temp: body["temperature"] = float(temp)
              json_mode = cfg.get("ai_json_mode") == "1"
              if json_mode: body["response_format"] = {"type": "json_object"}
              r = _post(base + "/chat/completions", headers, body, timeout)
              if r.status_code == 400 and json_mode:        # niektoré servery JSON režim nepodporujú
                  body.pop("response_format"); r = _post(base + "/chat/completions", headers, body, timeout)
              if r.status_code >= 400: raise LLMError(f"HTTP {r.status_code}: {r.text[:300]}")
              try:
                  text = r.json()["choices"][0]["message"]["content"] or ""
              except Exception:
                  raise LLMError(f"neočakávaná odpoveď: {r.text[:300]}")
          return text, time.time() - t0


      def extract_json(text):
          """Vytiahne prvý JSON objekt z odpovede (znáša ```json bloky a úvodný text)."""
          t = re.sub(r"^```(?:json)?|```$$", "", text.strip(), flags=re.M).strip()
          a, b = t.find("{"), t.rfind("}")
          if a < 0 or b <= a: raise ValueError("odpoveď neobsahuje JSON objekt")
          return json.loads(t[a:b + 1])


      def list_models(cfg):
          """Zoznam modelov z OpenAI-kompatibilného servera (Ollama: /v1/models). Pri chybe prázdny."""
          if cfg["ai_provider"] != "openai_compat" or not cfg["ai_base_url"].startswith("http"): return []
          try:
              headers = {"Authorization": "Bearer " + cfg["ai_api_key"]} if cfg["ai_api_key"] else {}
              r = requests.get(cfg["ai_base_url"].rstrip("/") + "/models", headers=headers, timeout=2.5)
              return sorted(m["id"] for m in r.json().get("data", []))[:200]
          except Exception:
              return []
