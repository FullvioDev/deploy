# =====================================================================================
# IG Brand Agents v1.2.0 – VARIANTA ZA EXISTUJÚCIM REVERSE PROXY (Traefik / Cloudflare tunel / nginx), bez Caddy.
# Rozhranie, noVNC aj webhooky idú cez JEDEN HTTPS port manažéra: PUBLIC_PORT (predvolene 2376) na PUBLIC_BIND (predvolene 127.0.0.1).
# Prihlasovanie (admin + ADMIN_PASSWORD) rieši aplikácia. Manažér hovorí HTTPS so self-signed certifikátom (vytvorí sa pri prvom
# štarte vo volume managertls); verejný certifikát dáva tvoj proxy, ktorý ide na backend cez https:// bez overenia (Traefik:
# insecureSkipVerify). Vlastný certifikát: nahraď /tls/cert.pem a /tls/key.pem vo volume a reštartuj manager. Návod: PROXY.md
# povinné: PUBLIC_URL, ADMIN_PASSWORD, POSTGRES_PASSWORD, WORKER_DB_PASSWORD, N8N_ENCRYPTION_KEY, COMMAND_KEY, APPROVAL_KEY, NOTIFY_URL, DATA_DIR
# Traefik (voliteľné): TRAEFIK_HOST, TRAEFIK_ENTRYPOINT, TRAEFIK_NETWORK, TRAEFIK_TLS, TRAEFIK_CERTRESOLVER, TRAEFIK_ENABLE
# Vyžaduje Docker Compose >= 2.24 (configs.content).
# =====================================================================================
name: ig-brand-agents

networks:
  default:
    name: ig_net

volumes:
  pgdata:
  n8ndata:
  ollamadata:
  managerdeps:
  managertls:

services:

  # ---- databáza (schéma a rola pre workery sa vytvoria pri prvom štarte z configs) ----
  postgres:
    image: postgres:16
    labels:
      - traefik.enable=false
    restart: unless-stopped
    environment:
      POSTGRES_USER: igagents
      POSTGRES_DB: igagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?nastav WORKER_DB_PASSWORD}
    ports: ["${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: db_schema
        target: /docker-entrypoint-initdb.d/01-schema.sql
      - source: db_roles
        target: /docker-entrypoint-initdb.d/03-roles.sh
        mode: 0755
    healthcheck:
      test: ["CMD-SHELL", "psql -U igagents -d igagents -tAc \"select 1 from pg_roles where rolname='ig_worker'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  # ---- jednorazový import credentialu a workflow do n8n (pri každom štarte; idempotentné) ----
  n8n-init:
    image: n8nio/n8n:1.100.1
    labels:
      - traefik.enable=false
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/creds.json <<EOF
        [{"id":"pgigagents","name":"Postgres igagents","type":"postgres","data":{"host":"postgres","port":5432,"database":"$$POSTGRES_DB","user":"$$POSTGRES_USER","password":"$$POSTGRES_PASSWORD","ssl":"disable","allowUnauthorizedCerts":false,"sshTunnel":false}}]
        EOF
        n8n import:credentials --input=/tmp/creds.json
        rm -f /tmp/creds.json
        n8n import:workflow --separate --input=/workflows/
        n8n update:workflow --all --active=true || echo "VAROVANIE: workflow aktivuj ručne v n8n (prepínač Active)"
    environment:
      POSTGRES_USER: igagents
      POSTGRES_DB: igagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?nastav N8N_ENCRYPTION_KEY}
    volumes:
      - n8ndata:/home/node/.n8n
    configs:
      - source: wf_01
        target: /workflows/01-intake.json
      - source: wf_02
        target: /workflows/02-approval.json
      - source: wf_03
        target: /workflows/03-risk-alert.json
      - source: wf_04
        target: /workflows/04-daily-report.json
      - source: wf_05
        target: /workflows/05-monitor.json
      - source: wf_06
        target: /workflows/06-daily-reset.json
    depends_on:
      postgres: {condition: service_healthy}

  n8n:
    image: n8nio/n8n:1.100.1
    labels:
      - traefik.enable=false
    restart: unless-stopped
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]        # editor len cez SSH tunel; webhooky idú cez manažér
    environment:
      GENERIC_TIMEZONE: ${TZ:-Europe/Bratislava}
      TZ: ${TZ:-Europe/Bratislava}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?nastav N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WEBHOOK_URL: ${PUBLIC_URL:?nastav PUBLIC_URL (napr. https://chromium.fullvio.dev/)}
      N8N_PUBLIC_URL: ${PUBLIC_URL:?nastav PUBLIC_URL}
      NOTIFY_URL: ${NOTIFY_URL:?nastav NOTIFY_URL}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      COMMAND_KEY: ${COMMAND_KEY:?nastav COMMAND_KEY}
      APPROVAL_KEY: ${APPROVAL_KEY:?nastav APPROVAL_KEY}
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      n8n-init: {condition: service_completed_successfully}

  # ---- webové rozhranie + správa workerov + AI vrstva ----
  manager:
    image: python:3.12-slim
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --no-cache-dir --target /deps -r /app/requirements.txt
        [ -s /tls/cert.pem ] && [ -s /tls/key.pem ] || openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=manager" -addext "subjectAltName=DNS:manager,DNS:localhost" -keyout /tls/key.pem -out /tls/cert.pem
        exec python -m uvicorn app:app --host 0.0.0.0 --port 8000 --ssl-keyfile /tls/key.pem --ssl-certfile /tls/cert.pem
    restart: unless-stopped
    ports: ["${PUBLIC_BIND:-127.0.0.1}:${PUBLIC_PORT:-2376}:8000"]      # jediný vstup (HTTPS): rozhranie, noVNC aj webhooky
    labels:                                                              # voliteľné, pre Traefik (TRAEFIK_ENABLE=false ich vypne)
      - traefik.enable=${TRAEFIK_ENABLE:-true}
      - traefik.docker.network=${TRAEFIK_NETWORK:-ig_net}
      - traefik.http.routers.ig.rule=Host(`${TRAEFIK_HOST:-ig.local}`)
      - traefik.http.routers.ig.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ig.tls=${TRAEFIK_TLS:-true}
      - traefik.http.routers.ig.tls.certresolver=${TRAEFIK_CERTRESOLVER:-}
      - traefik.http.services.ig.loadbalancer.server.port=8000
      - traefik.http.services.ig.loadbalancer.server.scheme=https
    environment:
      APP_AUTH: "on"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?nastav ADMIN_PASSWORD}
      PYTHONPATH: /deps
      WORKER_SRC: /worker-src
      BUILDER_IMAGE: docker:cli
      DATABASE_URL: postgresql://igagents:${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD}@postgres:5432/igagents
      WORKER_DATABASE_URL: postgresql://ig_worker:${WORKER_DB_PASSWORD:?nastav WORKER_DB_PASSWORD}@postgres:5432/igagents
      N8N_URL: http://n8n:5678
      COMMAND_KEY: ${COMMAND_KEY:?nastav COMMAND_KEY}
      HOST_DATA_DIR: ${DATA_DIR:?nastav DATA_DIR (absolútna cesta)}
      WORKER_IMAGE: ig-worker:1.2.0
      NETWORK: ig_net
      IG_LOCALE: ${IG_LOCALE:-en-US}
      TZ: ${TZ:-Europe/Bratislava}
      SEL_LIKE: ${SEL_LIKE:-}
      SEL_UNLIKE: ${SEL_UNLIKE:-}
      SEL_COMMENT: ${SEL_COMMENT:-}
      POST_LABEL: ${POST_LABEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NORDVPN_PRIVATE_KEY: ${NORDVPN_PRIVATE_KEY:-}
      VPN_COUNTRIES: ${VPN_COUNTRIES:-}
      VPN_CITIES: ${VPN_CITIES:-}
      VPN_IMAGE: qmcgaw/gluetun:${VPN_TAG:-v3}
      BLACKLIST_WORDS: ${BLACKLIST_WORDS:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - managerdeps:/deps
      - managertls:/tls
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_DIR:?nastav DATA_DIR}:/data-root
    configs:
      - source: boss_prompt
        target: /prompts/boss_agent.md
      - source: f_manager_app_py
        target: /app/app.py
      - source: f_manager_llm_py
        target: /app/llm.py
      - source: f_manager_requirements_txt
        target: /app/requirements.txt
      - source: f_manager_templates_account_html
        target: /app/templates/account.html
      - source: f_manager_templates_ai_html
        target: /app/templates/ai.html
      - source: f_manager_templates_base_html
        target: /app/templates/base.html
      - source: f_manager_templates_dashboard_html
        target: /app/templates/dashboard.html
      - source: f_manager_templates_login_html
        target: /app/templates/login.html
      - source: f_manager_templates_logs_html
        target: /app/templates/logs.html
      - source: f_manager_templates_settings_html
        target: /app/templates/settings.html
      - source: f_manager_templates_tasks_html
        target: /app/templates/tasks.html
      - source: f_manager_templates_vpn_html
        target: /app/templates/vpn.html
      - source: f_worker_Dockerfile
        target: /worker-src/Dockerfile
      - source: f_worker_worker_py
        target: /worker-src/worker.py
      - source: f_worker_login_sh
        target: /worker-src/login.sh
      - source: f_worker_requirements_txt
        target: /worker-src/requirements.txt
    depends_on:
      postgres: {condition: service_healthy}

  # ---- denná záloha DB (14 dní) a čistenie starých screenshotov (30 dní); ukladá do DATA_DIR/_backups ----
  backup:
    image: postgres:16
    labels:
      - traefik.enable=false
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data-root/_backups
        while true; do
          F=/data-root/_backups/db_$$(date +%F).sql.gz
          pg_dump --clean --if-exists -h postgres -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$F" && echo "záloha OK: $$F"
          find /data-root/_backups -name 'db_*.sql.gz' -mtime +14 -delete
          find /data-root -name '*.png' -mtime +30 -delete
          sleep 86400
        done
    environment:
      POSTGRES_USER: igagents
      POSTGRES_DB: igagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD:?nastav POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:?nastav DATA_DIR}:/data-root
    depends_on:
      postgres: {condition: service_healthy}

  # ---- voliteľný lokálny model: COMPOSE_PROFILES=llm a LOCAL_LLM_MODEL=qwen2.5:7b-instruct ----
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["llm"]
    volumes: [ollamadata:/root/.ollama]
    # GPU (NVIDIA Container Toolkit): odkomentuj
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    profiles: ["llm"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 3; done
        ollama pull "$$LOCAL_LLM_MODEL"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
    depends_on: [ollama]

# ---- vložené súbory ----
configs:
  db_schema:
    content: |
      -- PostgreSQL schema: správa 10 značkových Instagram účtov
      CREATE TABLE accounts (
        id                    serial PRIMARY KEY,
        ig_username           text UNIQUE NOT NULL,
        status                text NOT NULL DEFAULT 'paused' CHECK (status IN ('active','paused','risk')),
        brand_disclosed       boolean NOT NULL DEFAULT false,  -- operátor potvrdil, že účet je zjavne značkový
        dry_run               boolean NOT NULL DEFAULT true,   -- true = worker nič neodosiela (testovací režim)
        likes_today           int NOT NULL DEFAULT 0,
        comments_today        int NOT NULL DEFAULT 0,
        daily_like_limit      int NOT NULL DEFAULT 40,
        daily_comment_limit   int NOT NULL DEFAULT 12,
        hourly_action_limit   int NOT NULL DEFAULT 8,
        last_action_at        timestamptz,
        risk_reason           text,
        archived              boolean NOT NULL DEFAULT false,
        managed_locally       boolean NOT NULL DEFAULT true,     -- worker spúšťa GUI na tomto serveri
        vpn_mode              text NOT NULL DEFAULT 'nordvpn' CHECK (vpn_mode IN ('nordvpn','none')),
        vpn_country           text NOT NULL DEFAULT '',          -- NordVPN: krajina servera (napr. Slovakia)
        vpn_city              text NOT NULL DEFAULT '',
        vpn_hostname          text NOT NULL DEFAULT '',          -- voliteľné pripnutie konkrétneho servera (sk123.nordvpn.com)
        exit_ip               text,                              -- posledná zistená výstupná IP účtu
        last_seen             timestamptz,                       -- heartbeat workera
        tz                    text NOT NULL DEFAULT 'Europe/Bratislava',
        active_from           time NOT NULL DEFAULT '08:00',      -- časové okno, kedy smie účet konať
        active_to             time NOT NULL DEFAULT '22:00',
        pause_min_s           numeric NOT NULL DEFAULT 3,         -- pauza medzi akciami
        pause_max_s           numeric NOT NULL DEFAULT 12
      );

      -- blacklist (kind: word | author | post_url)
      CREATE TABLE blacklist (
        id    serial PRIMARY KEY,
        kind  text NOT NULL CHECK (kind IN ('word','author','post_url')),
        value text NOT NULL
      );

      CREATE TABLE tasks (
        id               bigserial PRIMARY KEY,
        account_id       int NOT NULL REFERENCES accounts(id),
        post_url         text NOT NULL,
        post_context     text,                       -- stručný popis príspevku od operátora (nescrapujeme)
        action           text NOT NULL CHECK (action IN ('like','comment')),
        comment_text     text,
        status           text NOT NULL DEFAULT 'pending'
                         CHECK (status IN ('pending','awaiting_approval','in_progress','done','failed','cancelled')),
        priority         int NOT NULL DEFAULT 0,
        attempts         int NOT NULL DEFAULT 0,
        max_attempts     int NOT NULL DEFAULT 3,
        requested_by     text,
        approved_by      text,
        approved_at      timestamptz,
        not_before       timestamptz,
        lease_expires_at timestamptz,
        created_at       timestamptz NOT NULL DEFAULT now(),
        started_at       timestamptz,
        finished_at      timestamptz,
        result           text,
        CHECK (action <> 'comment' OR comment_text IS NOT NULL)
      );
      CREATE INDEX tasks_queue_idx ON tasks (account_id, status, priority DESC, created_at);
      -- jeden text nesmie ísť dvakrát (kvalita, nie obchádzanie filtra)
      CREATE UNIQUE INDEX tasks_unique_comment ON tasks (md5(lower(trim(comment_text))))
        WHERE action = 'comment' AND status NOT IN ('failed','cancelled');
      -- jeden účet nepridá na ten istý post dve rovnaké akcie
      CREATE UNIQUE INDEX tasks_unique_action ON tasks (account_id, post_url, action)
        WHERE status NOT IN ('failed','cancelled');

      CREATE TABLE logs (
        id             bigserial PRIMARY KEY,
        task_id        bigint REFERENCES tasks(id),
        account_id     int REFERENCES accounts(id),
        event          text NOT NULL,       -- claimed | done | failed | risk | limit | reaped | ...
        screenshot_url text,
        error          text,
        created_at     timestamptz NOT NULL DEFAULT now()
      );


      -- nastavenia (AI model a pod.); ig_worker k nim NEMÁ prístup
      CREATE TABLE settings (key text PRIMARY KEY, value text NOT NULL);
  db_roles:
    content: |
      #!/bin/bash
      # Spustí sa pri prvom štarte Postgresu. Vytvorí používateľa s minimálnymi právami pre workery.
      set -e
      : "$${WORKER_DB_PASSWORD:?WORKER_DB_PASSWORD nie je nastavené}"
      psql -v ON_ERROR_STOP=1 -v wpass="$$WORKER_DB_PASSWORD" --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      CREATE ROLE ig_worker LOGIN PASSWORD :'wpass';
      GRANT CONNECT ON DATABASE :"DBNAME" TO ig_worker;
      GRANT USAGE ON SCHEMA public TO ig_worker;
      GRANT SELECT ON accounts, blacklist TO ig_worker;
      GRANT UPDATE (likes_today, comments_today, last_action_at, status, risk_reason, last_seen) ON accounts TO ig_worker;
      GRANT SELECT, UPDATE ON tasks TO ig_worker;
      GRANT INSERT ON logs TO ig_worker;
      GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO ig_worker;
      SQL
  boss_prompt:
    content: |
      # Systémový prompt – šéf-agent

      Si šéf-agent pre správu 10 zjavne značkových Instagram účtov. Prijímaš príkazy od ľudského operátora a vytváraš bezpečné, limitované úlohy (`like`, `comment`) pre workery. Žiadne iné akcie neexistujú.

      ## Vstup, ktorý dostaneš
      - príkaz operátora (post_url, voliteľne `post_context` = stručný popis príspevku od operátora, účet, tón)
      - stav účtov: status, brand_disclosed, likes_today, comments_today, limity
      - blacklist
      - posledné komentáre (na kontrolu opakovania)

      ## Pravidlá
      1. Úlohy vytváraj len pre účty so `status='active'` a `brand_disclosed=true`.
      2. Neprekroč denné limity (40 likeov / 12 komentárov) ani zvyšok limitu účtu. Ak operátor žiada riskantné množstvo naraz, upozorni ho a zníž počet.
      3. post_url nesmie byť na blackliste. Odkazy na príspevky použi IBA tie, ktoré operátor výslovne uviedol v príkaze; žiadne odkazy nevymýšľaj ani nehľadaj. Ak príkaz neobsahuje odkaz, úlohu nevytváraj a požiadaj o neho v `notes`.
      4. Priraďuj round-robin, pokiaľ operátor nešpecifikuje účet. Jeden účet nedáva na ten istý post dve akcie a na jeden post nekomentuje viac ako jeden účet.
      5. Komentár píš pre konkrétny príspevok podľa `post_context`. Bez kontextu komentár nevymýšľaj, vypýtaj si ho. Každý komentár má mať iné slová, dĺžku aj štruktúru. Žiadne copy-paste šablóny.
      6. Komentár nikdy nehovorí ani nenaznačuje, že autor je nezávislý zákazník, a neobsahuje vymyslené skúsenosti, testimoniály, hodnotenia ani porovnania s konkurenciou. Hovorí tónom značky, o veciach, ktoré reálne vieš z kontextu.
      7. Nepoužívaj slová z blacklistu, neosobuj sa, nerob odkazy ani výzvy na follow/DM.
      8. Všetky komentáre majú status `awaiting_approval`. Likes majú `pending`.
      9. Po vytvorení úloh stručne potvrď: účet, akcia, post.

      ## Výstup (iba JSON)
      ```json
      {
        "tasks": [
          {"account": "username", "post_url": "...", "action": "like|comment",
           "comment_text": "... (len pri comment)", "post_context": "..."}
        ],
        "rejected": [{"post_url": "...", "reason": "..."}],
        "notes": "krátke zhrnutie pre operátora"
      }
      ```
  wf_01:
    content: |
      {
        "name": "01 Intake",
        "nodes": [
          {
            "parameters": {
              "httpMethod": "POST",
              "path": "command",
              "responseMode": "lastNode",
              "options": {}
            },
            "name": "Webhook command",
            "type": "n8n-nodes-base.webhook",
            "typeVersion": 2,
            "position": [
              0,
              0
            ],
            "webhookId": "cmd-intake-1",
            "id": "b150699c-a964-4a57-85a1-5bedca5da7ec"
          },
          {
            "parameters": {
              "conditions": {
                "options": {
                  "caseSensitive": true,
                  "typeValidation": "loose"
                },
                "conditions": [
                  {
                    "leftValue": "={{ $$json.headers['x-api-key'] }}",
                    "rightValue": "={{ $$env.COMMAND_KEY }}",
                    "operator": {
                      "type": "string",
                      "operation": "equals"
                    }
                  }
                ],
                "combinator": "and"
              }
            },
            "name": "Auth ok?",
            "type": "n8n-nodes-base.if",
            "typeVersion": 2.2,
            "position": [
              220,
              0
            ],
            "id": "c7378636-244c-4d92-b5b1-c86473990f81"
          },
          {
            "parameters": {
              "method": "POST",
              "url": "https://manager:8000/api/agent",
              "sendHeaders": true,
              "headerParameters": {
                "parameters": [
                  {
                    "name": "x-api-key",
                    "value": "={{ $$env.COMMAND_KEY }}"
                  },
                  {
                    "name": "content-type",
                    "value": "application/json"
                  }
                ]
              },
              "sendBody": true,
              "specifyBody": "json",
              "jsonBody": "={{ JSON.stringify({ command: $$('Webhook command').first().json.body.command, requested_by: $$('Webhook command').first().json.body.requested_by || 'operator' }) }}",
              "options": {
                "timeout": 900000,
                "allowUnauthorizedCerts": true,
                "response": {
                  "response": {
                    "neverError": true
                  }
                }
              }
            },
            "name": "Boss agent (manager)",
            "type": "n8n-nodes-base.httpRequest",
            "typeVersion": 4.2,
            "position": [
              440,
              0
            ],
            "id": "0233485c-529a-4f7b-8215-aeceea29b4f6"
          },
          {
            "parameters": {
              "jsCode": "const j = $$json;\nif (!j.created) return [{ json: { msg: '⚠️ Šéf-agent zlyhal: ' + (j.data || JSON.stringify(j)).toString().slice(0, 400) } }];\nconst base = $$env.N8N_PUBLIC_URL, key = $$env.APPROVAL_KEY;\nlet msg = 'Vytvorených úloh: ' + j.created.length + ' (model ' + j.model + ')' + (j.notes ? '\\n' + j.notes : '') + '\\n';\nfor (const r of j.created) {\n  if (r.action === 'comment') msg += `\\n#$${r.id} komentár ($${r.account}) na $${r.post_url}\\n\"$${r.comment_text}\"\\n✅ $${base}webhook/approve?task=$${r.id}&key=$${key}&by=operator\\n❌ $${base}webhook/approve?task=$${r.id}&key=$${key}&decision=reject\\n`;\n  else msg += `\\n#$${r.id} like ($${r.account}) na $${r.post_url}`;\n}\nif (j.rejected && j.rejected.length) msg += '\\n\\nZamietnuté:\\n' + j.rejected.map(x => '- ' + x.reason + (x.post_url ? ' (' + x.post_url + ')' : '')).join('\\n');\nreturn [{ json: { msg } }];"
            },
            "name": "Build summary",
            "type": "n8n-nodes-base.code",
            "typeVersion": 2,
            "position": [
              660,
              0
            ],
            "id": "b595eb1e-81c0-4d1a-9ee3-07da38c4877f"
          },
