services:
  postgres:
    image: postgres:${POSTGRES_IMAGE:-16-alpine}
    container_name: ${POSTGRES_CNTNR:-curipet_api_postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-curipet}
      POSTGRES_USER: ${POSTGRES_USER:-curipet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${CURIPET_API_DIR:-/home/administrator/curipet-api}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curipet} -d ${POSTGRES_DB:-curipet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/fullviodev/curipet-api:${CURIPET_API_IMAGE_TAG:-latest}
    container_name: ${CURIPET_API_CNTNR:-curipet-api}
    restart: unless-stopped
    # Without this the JVM's -XX:MaxRAMPercentage=75.0 claims 75% of the HOST's
    # RAM, not the container's — see the Dockerfile ENTRYPOINT.
    mem_limit: 512m
    ports:
      - "${CURIPET_API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-curipet}
      DB_USER: ${POSTGRES_USER:-curipet}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # MUST equal curipet's JWT_SECRET (openssl rand -hex 32)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://curipet.com,https://www.curipet.com}
      PORT: "8080"
      # ── Stripe: the B2C subscription webhook ──────────────────────────────
      # SET THIS IN DOCKHAND ON THIS STACK. It used to live only on the curipet
      # stack, where stripe-replit-sync verified the webhook and mirrored Stripe
      # into a `stripe.*` schema over a Postgres pool it opened itself — from the
      # public-facing container that deliberately holds no database credentials.
      # That rail moved here, to the service that owns the database.
      #
      # Stripe still DELIVERS to the app (only it is routed publicly); the app
      # forwards the raw bytes to POST /api/stripe/webhook here with its service
      # token, and the signature is verified against this secret.
      #
      # BLANK REFUSES EVERY DELIVERY WITH 503 — deliberately, so a
      # misconfiguration is visible on Stripe's dashboard rather than silently
      # swallowing subscriptions. An on-prem install that sells no subscriptions
      # leaves it blank and runs on manually granted users.subscription_status.
      #
      # NO STRIPE_SECRET_KEY HERE, on purpose: verifying a signature is HMAC over
      # the request bytes and this service makes no outbound Stripe calls, so the
      # API key stays on the curipet stack with the Checkout/Portal flows.
      # STRIPE_CONNECT_WEBHOOK_SECRET stays there too — that rail is Node's.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Set to "dev" to seed vet@test.curipet.com / owner1@test.curipet.com /
      # owner2@test.curipet.com with sample pets + appointments on first boot
      # of an empty database. Leave unset on any deployment with real data —
      # this must never be "dev" on production.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Debug the JWT filter (bad signature / expired / malformed claim) —
      # blank by default, set to DEBUG in Dockhand only while investigating.
      LOGGING_LEVEL_COM_CURIPET_API_SECURITY: ${LOGGING_LEVEL_COM_CURIPET_API_SECURITY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
