# CuripackAPI — the community's API.
#
# NO DATABASE, AND THAT IS NOT AN OMISSION HERE. This service has no JPA, JDBC,
# Postgres or Flyway dependency at all: posts, reactions and sessions live in a
# ConcurrentHashMap in the process. So unlike curipet-api there is no postgres
# service and no volume to mount, and — read this before going live —
# EVERY POST AND EVERY SIGN-IN IS LOST WHEN THIS CONTAINER RESTARTS. A pull of a
# new image tag empties the community. That is a property of the application as
# it stands today, not of this stack; it needs persistence in CuripackAPI before
# the content here is worth keeping.
services:
  api:
    image: ghcr.io/fullviodev/curipack-api:${CURIPACK_API_IMAGE_TAG:-latest}
    container_name: ${CURIPACK_API_CNTNR:-curipack-api}
    restart: unless-stopped
    # Without this the JVM's -XX:MaxRAMPercentage=75.0 claims 75% of the HOST's
    # RAM, not the container's — same reason curipet-api sets it. Lower than that
    # stack's 1024m because there is no database layer here; the service runs at
    # roughly 190 MB resident.
    mem_limit: 512m
    # 8081 because 8080 is curipet-api and 8090 is curipet on this host. The
    # container listens on 8090, which is what application.yml defaults to.
    ports:
      - "${CURIPACK_API_PORT:-8081}:8090"
    environment:
      SERVER_PORT: "8090"

      # REQUIRED. Curipet's signing key, BYTE-IDENTICAL to the JWT_SECRET of the
      # Curipet deployment members sign in at — the same value the curipet and
      # curipet-api stacks carry. Curipack only ever VERIFIES with it and never
      # mints a token with it.
      #
      # The service refuses to start if it is missing, which is deliberate: the
      # alternative is a container that comes up and quietly accepts anonymous
      # writes. If it is set but WRONG, every sign-in is refused and the only
      # place that says so is this service's own log, at WARN, naming
      # BAD_SIGNATURE — Curipet's side looks perfectly healthy.
      CURIPET_JWT_SECRET: ${CURIPET_JWT_SECRET}

      # SET THIS. Curipack's OWN key for the session tokens it issues at
      # POST /api/auth/session — at least 32 bytes, `openssl rand -hex 32`, and
      # NOT the Curipet secret above: that one belongs to another product.
      #
      # Left blank the service generates a random key per process and logs a
      # warning, which means everyone is signed out every time this container
      # restarts, however long CURIPACK_SESSION_TTL says a session lasts.
      CURIPACK_SESSION_SECRET: ${CURIPACK_SESSION_SECRET:-}

      # How long an issued session is accepted, ISO-8601. There is no refresh:
      # when it runs out the member signs in through Curipet again.
      CURIPACK_SESSION_TTL: ${CURIPACK_SESSION_TTL:-PT12H}

      # Origins allowed to call /api/** from a browser. Only load-bearing when
      # the app and the API are on DIFFERENT origins; if the edge serves both
      # under one host, the browser makes no cross-origin request and this is
      # never consulted. Wrong here and every API call fails CORS while the API
      # itself looks healthy.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://curipet.com}

      # Swagger UI and the OpenAPI JSON are enabled by default and the service
      # warns about both at every boot. Off here: this is a public deployment and
      # the contract does not need publishing with it.
      SPRINGDOC_APIDOCS_ENABLED: ${SPRINGDOC_APIDOCS_ENABLED:-false}
      SPRINGDOC_SWAGGERUI_ENABLED: ${SPRINGDOC_SWAGGERUI_ENABLED:-false}
    # /api/categories rather than a health endpoint, because there is no health
    # endpoint: no actuator dependency and nothing hand-written. It is the
    # cheapest honest probe available — a fixed in-memory catalogue, served
    # unauthenticated, that answers 200 only once the context is up.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/api/categories || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
