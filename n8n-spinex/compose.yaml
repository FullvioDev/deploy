# Runner image = n8nio/runners + the extra modules Code nodes require().
# The stock image ships only `moment`, and its launcher config
# (/etc/n8n-task-runners.json) hard-codes NODE_FUNCTION_ALLOW_BUILTIN=crypto and
# NODE_FUNCTION_ALLOW_EXTERNAL=moment in env-overrides, so the NODE_FUNCTION_ALLOW_*
# set on the runner containers never reached the runner. The build moves both
# keys from env-overrides to allowed-env, so the values in the runners'
# `environment:` are the ones that apply. A new external module needs both:
# `pnpm add` here and an entry in NODE_FUNCTION_ALLOW_EXTERNAL on the runners.
x-runners-build: &runners-build
  dockerfile_inline: |
    FROM n8nio/runners:${RUNNERS_IMAGE:-2.31.5}
    USER root
    # pnpm pinned to PNPM_VERSION from n8n's docker/images/runners/Dockerfile: a bare
    # `pnpm` resolves to corepack's latest (11.x), which re-resolves the whole graph.
    RUN cd /opt/runners/task-runner-javascript && \
        COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm@10.32.1 add --prod --no-lockfile \
          xml-crypto@6.4.0 iconv-lite@0.7.3 @xmldom/xmldom@0.8.15
    RUN node -e "const fs = require('fs'), f = '/etc/n8n-task-runners.json'; \
          const cfg = JSON.parse(fs.readFileSync(f, 'utf8')); \
          const js = cfg['task-runners'].find((r) => r['runner-type'] === 'javascript'); \
          for (const k of ['NODE_FUNCTION_ALLOW_BUILTIN', 'NODE_FUNCTION_ALLOW_EXTERNAL']) { \
            delete js['env-overrides'][k]; \
            js['allowed-env'].push(k); \
          } \
          fs.writeFileSync(f, JSON.stringify(cfg, null, 2));"
    USER runner

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE:-16}
    container_name: ${POSTGRES_CNTNR:-n8n_postgres}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${N8N_DIR:-/home/administrator/n8n}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_IMAGE:-7-alpine}
    container_name: ${REDIS_CNTNR:-n8n_redis}
    restart: always
    volumes:
      - ${N8N_DIR:-/home/administrator/n8n}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_IMAGE:-2.31.5}
    container_name: ${N8N_CNTNR:-n8n}
    restart: always
    ports:
      - "${HOST_PORT:-5678}:5678"
    environment:
      NODE_ENV: "production"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: "https"
      N8N_EDITOR_BASE_URL: ${EDITOR_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: "Europe/Vienna"
      TZ: "Europe/Vienna"
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: "queue"
      QUEUE_BULL_REDIS_HOST: "redis"
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: "external"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_METRICS: "true"
      N8N_METRICS_PREFIX: "n8n_"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
      N8N_METRICS_INCLUDE_CACHE_METRICS: "true"
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
      N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
      N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
      N8N_METRICS_QUEUE_METRICS_INTERVAL: "10"
      N8N_METRICS_INCLUDE_API_ENDPOINTS: "true"
      N8N_METRICS_INCLUDE_API_METHOD_LABEL: "true"
      N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODE_FUNCTION_ALLOW_EXTERNAL: xml-crypto,iconv-lite,@xmldom/xmldom
    volumes:
      - ${N8N_DIR:-/home/administrator/n8n}/data/n8n:/home/node/.n8n
      - ${N8N_DIR:-/home/administrator/n8n}/local-files:/home/node/.n8n-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        
  n8n-worker:
    image: n8nio/n8n:${N8N_IMAGE:-2.31.5}
    container_name: ${N8N_WORKER_CNTNR:-n8n_worker}
    restart: always
    command: worker
    ports:
      - "${WORKER_METRICS_PORT:-5688}:5678"
    environment:
      NODE_ENV: "production"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_MODE: "queue"
      QUEUE_BULL_REDIS_HOST: "redis"
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: "external"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      QUEUE_HEALTH_CHECK_PORT: 5678
      N8N_METRICS: "true"
      N8N_METRICS_PREFIX: "n8n_"
      N8N_METRICS_INCLUDE_DEFAULT_METRICS: "true"
      N8N_METRICS_INCLUDE_CACHE_METRICS: "true"
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
      N8N_METRICS_INCLUDE_NODE_TYPE_LABEL: "true"
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODE_FUNCTION_ALLOW_EXTERNAL: xml-crypto,iconv-lite,@xmldom/xmldom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n-runners-main:
    image: n8n-spinex-runners:${RUNNERS_IMAGE:-2.31.5}
    build: *runners-build
    pull_policy: build
    container_name: ${N8N_RUNNERS_MAIN_CNTNR:-n8n_runners-main}
    restart: always
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n:5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODE_FUNCTION_ALLOW_EXTERNAL: xml-crypto,iconv-lite,@xmldom/xmldom
    depends_on:
      - n8n

  n8n-runners-worker:
    image: n8n-spinex-runners:${RUNNERS_IMAGE:-2.31.5}
    build: *runners-build
    pull_policy: build
    container_name: ${N8N_RUNNERS_WORKER_CNTNR:-n8n_runners-worker}
    restart: always
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n-worker:5679"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      NODE_FUNCTION_ALLOW_EXTERNAL: xml-crypto,iconv-lite,@xmldom/xmldom
    depends_on:
      - n8n-worker
